  modes:
    search: [q]
    # season/ep are declared so Sonarr sends episode and season searches. They are not sent to the API:
    # S02E04 goes into .Keywords, so q carries it.
    tv-search: [q, season, ep, imdbid, tmdbid]
    movie-search: [q, imdbid, tmdbid]

settings:
  - name: apikey
    type: password
    label: API Key
  - name: info_apikey
    type: info
    label: About the API Key
    default: "Generate the key at <a href=\"https://amigos-share.club/configuracoes/integracoes\" target=\"_blank\">Configurações → Integrações</a>, card <b>Indexador (Prowlarr ou Jackett)</b>. It is shown only once; if you lose it, generate a new one."
  - name: freeleech
    type: checkbox
    label: Search freeleech only
    default: false
  - name: single_file_release_use_filename
    type: checkbox
    label: Use filename as title for single file releases
    default: true
  - name: info_activity
    type: info
    label: Account Inactivity
    default: "Inactive accounts, that is, without access for 90 days (3 months), will be automatically deleted by the system; with no possibility of reactivation."

login:
  # returns "401 Unauthorized, check your credentials" if apikey is invalid
  path: api/v1/torrents
  method: get
  inputs:
    per_page: 1

search:
  paths:
    - path: api/v1/torrents
      response:
        type: json

  headers:
    Authorization: ["Bearer {{ .Config.apikey }}"]
    Accept: ["application/json"]

  inputs:
    $raw: "{{ range .Categories }}categories[]={{.}}&{{end}}"
    q: "{{ .Keywords }}"
    imdb: "{{ .Query.IMDBID }}"
    tmdb: "{{ .Query.TMDBID }}"
    freeleech: "{{ if .Config.freeleech }}1{{ else }}{{ end }}"

  rows:
    selector: data

  fields:
    # the site builds the release title, so the fields are a plain mapping
    category:
      selector: indexer_category
    title_optional:
      selector: name
    title_filename:
      selector: title
    files:
      selector: num_files
    title:
      text: "{{ if and (.Config.single_file_release_use_filename) (eq .Result.files \"1\") (.Result.title_filename) }}{{ .Result.title_filename }}{{ else }}{{ .Result.title_optional }}{{ end }}"
    details:
      selector: details_url
    download:
      selector: download_url
    infohash:
      selector: info_hash
    imdbid:
      selector: imdb_id
    tmdbid:
      selector: tmdb_id
    poster:
      selector: poster
    date:
      selector: published_at
    size:
      selector: size
    seeders:
      selector: seeders
    leechers:
      selector: leechers
    grabs:
      selector: grabs
    downloadvolumefactor:
      selector: download_volume_factor
    uploadvolumefactor:
      selector: upload_volume_factor
    minimumratio:
      selector: minimum_ratio
    minimumseedtime:
      selector: minimum_seed_time
# json api
