  modes:
    search: [q]
    tv-search: [q, season, ep, imdbid]
    movie-search: [q, imdbid]
    book-search: [q]
  allowrawsearch: true

settings:
  - name: cookie
    type: text
    label: Cookie
  - name: info_cookie
    type: info_cookie
  - name: info_login
    type: info
    label: About the Cookie
    default: "The site's login is protected by a CSRF token that cannot be supplied from a definition, so a browser cookie is required.<br />Tick <b>Lembrar-me</b> when logging in so the cookie includes <b>remember_web_…</b> and lasts longer."
  - name: freeleech
    type: checkbox
    label: Search freeleech only
    default: false
  - name: sort
    type: select
    label: Sort requested from site
    default: released_at
    options:
      released_at: created
      seeders: seeders
      times_completed: grabs
      size: size
      name: title
  - name: type
    type: select
    label: Order requested from site
    default: desc
    options:
      desc: desc
      asc: asc
  - name: info_activity
    type: info
    label: Account Inactivity
    default: "Inactive accounts, that is, without access for 90 days (3 months), will be automatically deleted by the system; with no possibility of reactivation."

login:
  # the site is Laravel + Inertia: POST /login needs an X-XSRF-TOKEN header copied from a cookie, which Cardigann cannot do
  method: cookie
  inputs:
    cookie: "{{ .Config.cookie }}"
  test:
    path: torrents
    selector: script[data-page="app"]:contains('"user":{"id":')

search:
  paths:
    # https://amigos-share.club/torrents?q=&sort=released_at&direction=desc&per_page=96
    - path: torrents
  inputs:
    # site search matches all words and also accepts imdb ids (tt1234567)
    q: "{{ if .Query.IMDBID }}{{ .Query.IMDBID }}{{ else }}{{ .Keywords }}{{ end }}"
    # note: site supports a single category only, and a parent includes its children
    freeleech: "{{ if .Config.freeleech }}1{{ else }}{{ end }}"
    sort: "{{ .Config.sort }}"
    direction: "{{ .Config.type }}"
    # max allowed
    per_page: 96
  keywordsfilters:
    - name: re_replace
      args: ["(\\s+:\\s+)", " "] # replace " : " with " " since site does not support colon in search and it is commonly used in titles to separate title from year or season/episode info
    # drop the year from searches since the site returns no results when it is included
    - name: re_replace
      args: ["(\\s*\\b((19|20)\\d{2})\\b)", ""]

  # the page is rendered client side by Inertia: results are only available as JSON in <script data-page="app">.
  # requesting the JSON directly needs the X-Inertia-Version asset hash, which changes on every site deploy,
  # and Cardigann does not run preprocessingfilters on json responses, so turn each torrent object into a div instead.
  preprocessingfilters:
    - name: regexp
      args: "\"torrents\":\\{\"current_page\":\\d+,\"data\":\\[(.*?)\\],\"first_page_url\""
    # each torrent object ends right before the next {"id": or the end (nested badge objects are never followed by {"id":)
    - name: re_replace
      args: ["(\\{\"id\":\\d+,.*?\\})(?=,\\{\"id\":\\d+,|$)", "<div class=\"torrent\">$1</div>"]

  rows:
    selector: div.torrent

  # each row's text is the raw JSON object of a torrent.
  # strings are extracted as a JSON literal and decoded with jsonjoinarray to resolve \uXXXX and \/ escapes.
  fields:
    _id:
      filters:
        - name: regexp
          args: "\"id\":(\\d+)"
    category:
      filters:
        - name: regexp
          args: "\"categoryId\":(\\d+)"
    _name:
      filters:
        - name: regexp
          args: "\"name\":(\"(?:[^\"\\\\]|\\\\.)*\")"
        - name: prepend
          args: "{\"v\":["
        - name: append
          args: "]}"
        - name: jsonjoinarray
          args: ["$.v", ""]
    _year:
      optional: true
      filters:
        - name: regexp
          args: "\"year\":(\\d{4})"
    _badges:
      # listing badges as {"label":"4K","kind":"resolution"}, in site order: resolution, hdr, source, audio, codec, language...
      # keep the labels of the kinds useful for the title, e.g. 2160p Dolby Vision HDR H.265
      optional: true
      filters:
        - name: regexp
          args: "\"badges\":\\[(.*?)\\]"
        - name: re_replace
          args: ["\\{\"label\":\"(?:[^\"\\\\]|\\\\.)*\",\"kind\":\"(?!(?:resolution|source|hdr|codec)\")[^\"]*\"\\},?", ""]
        - name: re_replace
          args: ["\\{\"label\":\"((?:[^\"\\\\]|\\\\.)*)\",\"kind\":\"[^\"]*\"\\},?", "$1 "]
        - name: re_replace
          args: ["\\b4K\\b", "2160p"]
        - name: trim
    _audio:
      # Dual Áudio, Dublado, Nacional or Legendado. labels are not decoded (Dual \u00c1udio), so match on the prefix
      optional: true
      filters:
        - name: regexp
          args: "\\{\"label\":\"((?:[^\"\\\\]|\\\\.)*)\",\"kind\":\"audio\"\\}"
        - name: re_replace
          args: ["^Dual.*$", "Dual-Audio Brazilian Original"]
        - name: re_replace
          args: ["^Dublado$", "Dublado Brazilian"]
    title:
      text: "{{ .Result._name }}"
      filters:
        # strip out the non-english title [to the left of the brackets] and drop the brackets enclosing the english title
        - name: re_replace
          args: ["^(.*?)[\\(](.*?)[\\)](.*?)$", "$2$3"]
        # add the year to the title
        - name: append
          args: "{{ if .Result._year }} {{ .Result._year }}{{ else }}{{ end }}"
        # move the year before the season/episode: "Title - S02E05 2024" to "Title 2024 S02E05"
        - name: re_replace
          args: ["^(.*?)\\s+-\\s+(S\\d{1,2}(?:E\\d{1,4}(?:E\\d{1,4})*)?)\\s+((?:19|20)\\d{2})(.*)$", "$1 $3 $2$4"]
        - name: append
          args: "{{ if .Result._badges }} {{ .Result._badges }}{{ else }}{{ end }}"
        - name: append
          args: "{{ if .Result._audio }} {{ .Result._audio }}{{ else }}{{ end }}"
    details:
      text: "/torrents/{{ .Result._id }}"
    download:
      text: "/torrents/{{ .Result._id }}/download"
    poster:
      optional: true
      filters:
        - name: regexp
          args: "\"cover\":\"([^\"]+)\""
        - name: replace
          args: ["\\/", "/"]
    date:
      # yyyy-MM-dd only
      optional: true
      default: now
      filters:
        - name: regexp
          args: "\"releasedAt\":\"([^\"]+)\""
        - name: dateparse
          args: "yyyy-MM-dd"
    size:
      filters:
        - name: regexp
          args: "\"size\":(\\d+)"
    seeders:
      filters:
        - name: regexp
          args: "\"seeders\":(\\d+)"
    leechers:
      filters:
        - name: regexp
          args: "\"leechers\":(\\d+)"
    grabs:
      filters:
        - name: regexp
          args: "\"timesCompleted\":(\\d+)"
    genre:
      optional: true
      filters:
        - name: jsonjoinarray
          args: ["$.genres", ", "]
    description:
      text: "{{ .Result.genre }}"
    downloadvolumefactor:
      filters:
        - name: regexp
          args: "\"freeleech\":(true|false)"
        - name: replace
          args: ["true", "0"]
        - name: replace
          args: ["false", "1"]
    uploadvolumefactor:
      filters:
        - name: regexp
          args: "\"doubleUpload\":(true|false)"
        - name: replace
          args: ["true", "2"]
        - name: replace
          args: ["false", "1"]
    minimumratio:
      text: 1.0
# engine n/a
