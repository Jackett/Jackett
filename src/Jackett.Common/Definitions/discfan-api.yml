---
id: discfan-api
name: DiscFan (API)
description: "DiscFan is a CHINESE Private Torrent Tracker for MOVIES / TV"
language: zh-CN
type: private
encoding: UTF-8
requestDelay: 2
links:
  - https://discfan.net/

caps:
  categorymappings:
    - {id: 401, cat: Movies, desc: "中国大陆(CHN)"}
    - {id: 404, cat: Movies, desc: "中国香港特别行政区(HKG)"}
    - {id: 405, cat: Movies, desc: "中国台湾省(TWN)"}
    - {id: 402, cat: Movies, desc: "泰国(THA)"}
    - {id: 403, cat: Movies, desc: "日本(JPN)"}
    - {id: 406, cat: Movies, desc: "韩国(KOR)"}
    - {id: 410, cat: Movies, desc: "世界(World)"}
    - {id: 411, cat: TV, desc: "剧集(Series)"}
    - {id: 414, cat: Audio, desc: "音乐(Music)"}
    - {id: 413, cat: TV/Documentary, desc: "记录(Documentary)"}
    - {id: 416, cat: TV, desc: "综艺(Variety Show)"}
    - {id: 417, cat: TV/Sport, desc: "体育(Sports)"}
    - {id: 419, cat: TV/Anime, desc: "动漫(Animation)"}

  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]

settings:
  - name: apikey
    type: text
    label: API Token
  - name: info_apikey
    type: info
    label: About your API Token
    default: "Find/Generate an API token from your <a href=\"https://discfan.net/usercp.php\" target=\"_blank\">DiscFan</a> account control panel."
  - name: passkey
    type: text
    label: Passkey
  - name: info_passkey
    type: info
    label: About your Passkey
    default: "Find the Passkey from your account control panel."
  - name: freeleech
    type: checkbox
    label: Filter freeleech only
    default: false
  - name: sort
    type: select
    label: Sort requested from site
    default: "-id"
    options:
      "-id": created
      "-seeders": seeders
      "-size": size
      "-times_completed": grabs
  - name: info_activity
    type: info
    label: Account Inactivity
    default: "Cherish your user account. Check DiscFan rules for retention and activity requirements."

login:
  path: api/v1/torrents
  method: get
  inputs:
    per_page: 1
  error:
    - selector: :root:contains("login.php?returnto")
      message:
        text: "The API token was not accepted by {{ .Config.sitelink }}."
    - selector: :root:contains("Unauthenticated")
      message:
        text: "The API token was not accepted by {{ .Config.sitelink }}."

search:
  paths:
    - path: api/v1/torrents
      response:
        type: json

  headers:
    Authorization: ["Bearer {{ .Config.apikey }}"]

  inputs:
    $raw: "{{ range .Categories }}&filter[category][in][]={{.}}{{end}}"
    "filter[title]": "{{ .Keywords }}"
    sorts: "{{ .Config.sort }}"
    per_page: 100

  keywordsfilters:
    # the site stores dotted release names but the title filter matches on words
    - name: re_replace
      args: ["\\.", " "]

  rows:
    selector: "data.data{{ if .Config.freeleech }}:not(promotion_info.down_multiplier:contains(1)):not(promotion_info.down_multiplier:contains(.)){{ else }}{{ end }}"

  fields:
    category:
      selector: category
    _id:
      selector: id
    title:
      selector: name
    details:
      text: "{{ .Config.sitelink }}details.php?id={{ .Result._id }}&hit=1"
    download:
      text: "{{ .Config.sitelink }}download.php?id={{ .Result._id }}&passkey={{ .Config.passkey }}"
    infohash:
      selector: hash
    poster:
      selector: cover
    description:
      selector: small_descr
    size:
      selector: size
    files:
      selector: numfiles
    seeders:
      selector: seeders
    leechers:
      selector: leechers
    grabs:
      selector: times_completed
    date:
      # 2026-09-19 16:50
      selector: added
      filters:
        - name: append
          args: " +08:00" # CST
        - name: dateparse
          args: "yyyy-MM-dd HH:mm zzz"
    downloadvolumefactor:
      # promotion_info is the EFFECTIVE promotion and accounts for site-wide freeleech events.
      # sp_state is only the stored per-torrent promotion, so it reads 1 on a torrent the site has made free.
      selector: promotion_info.down_multiplier
    uploadvolumefactor:
      selector: promotion_info.up_multiplier
    minimumratio:
      text: 0.9
    minimumseedtime:
      # 1 day (as seconds = 24 x 60 x 60)
      text: 86400
# JSON API NexusPHP v1.10.3 2026-06-28
