caps:
  categorymappings:
    - {id: Video, cat: TV, desc: Video}
    - {id: Video, cat: Movies, desc: Video}
    - {id: Music, cat: Audio, desc: Music}
    - {id: Images, cat: Other, desc: Images}
    - {id: Documents, cat: Books, desc: Documents}
    - {id: Archives, cat: Other, desc: Archives}
    - {id: Apps, cat: PC, desc: Apps}
    - {id: Other, cat: Other, desc: Other}

  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]
    book-search: [q]

settings:
  - name: cat-id
    type: select
    label: Category
    default: 0
    options:
      0: All categories
      1: Film and Television
      2: Music
      3: Images
      4: Books
      5: Zip Files
      6: Software
      7: Other
  - name: sort
    type: select
    label: Sort requested from site
    default: 2
    options:
      2: created
      1: size
      0: relevance
  - name: info_flaresolverr
    type: info_flaresolverr

search:
  paths:
    - path: "search-{{ if .Keywords }}{{ .Keywords }}{{ else }}{{ .Today.Year }}{{ end }}-{{ .Config.cat-id }}-{{ .Config.sort }}-1.html?lang=en"
    - path: "search-{{ if .Keywords }}{{ .Keywords }}{{ else }}{{ .Today.Year }}{{ end }}-{{ .Config.cat-id }}-{{ .Config.sort }}-2.html?lang=en"
  error:
    - selector: :root:contains("Internal Server Error")

  rows:
    selector: article.resource-card

  fields:
    categorydesc:
      selector: a[href^="/hash/"] span
      filters:
        - name: replace
          args: ["【", ""]
        - name: replace
          args: ["】", ""]
    title:
      selector: a[href^="/hash/"]
      remove: span
    details:
      selector: a[href^="/hash/"]
      attribute: href
    infohash:
      selector: a[href^="/hash/"]
      attribute: href
      filters:
        - name: regexp
          args: ([A-F|a-f|0-9]{40})
    date:
      selector: div.meta span:nth-child(1)
      filters:
        - name: replace
          args: ["Added：", ""]
        - name: append
          args: " +08:00" # CST
        - name: dateparse
          args: "yyyy-MM-dd zzz"
    size:
      selector: div.meta span:nth-child(2)
      filters:
        - name: replace
          args: ["Size：", ""]
    seeders:
      text: 1
    leechers:
      text: 1
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
# engine n/a
