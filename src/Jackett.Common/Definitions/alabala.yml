---
id: alabala
name: AlaBala
description: "AlaBala is a BULGARIAN Private Torrent Tracker for MOVIES / TV / GENERAL"
language: bg-BG
type: private
encoding: UTF-8
links:
  - https://alabala.net/

caps:
  categorymappings:
    - {id: 9, cat: TV/Anime, desc: "Anime"}
    - {id: 26, cat: PC, desc: "Apps"}
    - {id: 27, cat: TV/Documentary, desc: "Documentaries"}
    - {id: 28, cat: Books, desc: "Ebooks"}
    - {id: 2, cat: PC/Games, desc: "Games/PC ISO"}
    - {id: 12, cat: Console/PS3, desc: "Games/PS"}
    - {id: 24, cat: Movies, desc: "Movies BG Audio"}
    - {id: 25, cat: Movies, desc: "Movies Boxset"}
    - {id: 14, cat: Movies/UHD, desc: "Movies/4k"}
    - {id: 10, cat: Movies/BluRay, desc: "Movies/Bluray"}
    - {id: 11, cat: Movies/DVD, desc: "Movies/DVD-R"}
    - {id: 15, cat: Movies/HD, desc: "Movies/HD"}
    - {id: 16, cat: Movies/SD, desc: "Movies/SD"}
    - {id: 23, cat: Audio/Lossless, desc: "Music HD"}
    - {id: 4, cat: Audio/MP3, desc: "Music MP3"}
    - {id: 17, cat: TV/UHD, desc: "TV 4k"}
    - {id: 18, cat: TV/HD, desc: "TV HD"}
    - {id: 19, cat: TV/SD, desc: "TV SD"}
    - {id: 20, cat: TV/UHD, desc: "TVBoxset 4k"}
    - {id: 21, cat: TV/HD, desc: "TVBoxset HD"}
    - {id: 22, cat: TV/SD, desc: "TVBoxset SD"}
    - {id: 6, cat: XXX, desc: "XXX"}

  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]
    book-search: [q]

settings:
  - name: username
    type: text
    label: Username
  - name: password
    type: password
    label: Password
  - name: info_tpp
    type: info
    label: Results Per Page
    default: For best results, change the <b>Torrents per page:</b> setting to <b>100</b> on your account profile.

login:
  path: login.php
  method: form
  form: form[action="takelogin.php"]
  inputs:
    username: "{{ .Config.username }}"
    password: "{{ .Config.password }}"
  captcha:
    type: image
    selector: img.cimage
    input: captcha
  # takelogin.php does not return anything after an error, just redirect straight back to login.php
  test:
    path: index.php
    selector: a[href="logout.php"]

search:
  paths:
    # https://alabala.net/browse.php?f=1&search=&cat=28&intitle=1
    - path: browse.php
  inputs:
    f: 1
    search: "{{ .Keywords }}"
    # does not appear to support multi cat search
    cat: 0
    intitle: 1

  rows:
    selector: div.bv-switch ~ div.torrenttable-scroll > table > tbody > tr:has(td.tt-name)

  fields:
    category:
      selector: a[href^="browse.php?cat="]
      attribute: href
      filters:
        - name: querystring
          args: cat
    _bg:
      selector: img[alt="BG audio"]
      attribute: alt
      optional: true
    title:
      selector: a[href^="details.php?id="]
      filters:
        - name: append
          args: "{{ if .Result._bg }} (BG audio){{ else }}{{ end }}"
    details:
      selector: a[href^="details.php?id="]
      attribute: href
    _id:
      selector: a[href^="details.php?id="]
      attribute: href
      filters:
        - name: querystring
          args: id
    download:
      text: "download.php?torrent={{ .Result._id }}"
      attribute: href
    poster:
      selector: span.tb-pv-img img
      attribute: src
    # two flavours
    date_day:
      # Today<br /> 04:05 PM
      # Yesterday<br /> 05:42 AM
      # Днес<br /> 12:40 PM
      # Вчера<br /> 09:17 PM
      selector: td[data-l="Added"]:contains("day"), td[data-l="Added"]:contains("Днес"), td[data-l="Added"]:contains("Вчера"), td[data-l="Добавен"]:contains("day"), td[data-l="Добавен"]:contains("Днес"), td[data-l="Добавен"]:contains("Вчера")
      # auto adjusted by site account profile
      optional: true
      filters:
        - name: re_replace
          args: ["(?i)Днес", "Today"]
        - name: re_replace
          args: ["(?i)Вчера", "Yesterday"]
    date_year:
      # Sep 27 2026<br /> 02:32 AM
      selector: td[data-l="Added"]:not(:contains("day")):not(:contains("Днес")):not(:contains("Вчера")), td[data-l="Добавен"]:not(:contains("day")):not(:contains("Днес")):not(:contains("Вчера"))
      # auto adjusted by site account profile
      optional: true
      filters:
        - name: dateparse
          args: "MMM dd yyyy hh:mm tt"
    date:
      text: "{{ if or .Result.date_day .Result.date_year }}{{ or .Result.date_day .Result.date_year }}{{ else }}now{{ end }}"
    files:
      selector: td[data-l="Files"], td[data-l="Файлове"]
    size:
      selector: td[data-l="Size"], td[data-l="Размер"]
    seeders:
      selector: td[data-l="Seeders"], td[data-l="Сийдъри"]
    leechers:
      selector: td[data-l="Leechers"], td[data-l="Лийчъри"]
    grabs:
      selector: td[data-l="Snatched"], td[data-l="Изтеглен"]
    downloadvolumefactor:
      case:
        span:contains("FREE"): 0
        "*": 1
    uploadvolumefactor:
      text: 1
    minimumseedtime:
      # 3 days (as seconds = 3 x 24 x 60 x 60)
      text: 259200
# engine tbd
