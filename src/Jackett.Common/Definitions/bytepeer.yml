---
id: bytepeer
name: BytePeer
description: "BytePeer is a Private Torrent Tracker for MOVIES / TV / GENERAL"
language: en-US
type: private
encoding: UTF-8
links:
  - https://bytepeer.net/

caps:
  categorymappings:
    # from  https://bytepeer.net/torznab/api?t=caps&apikey=YOUR-API-KEY
    - {id: 2000, cat: Movies, desc: "Movies"}
    - {id: 3000, cat: Audio, desc: "Music"}
    - {id: 4000, cat: PC, desc: "Software"}
    - {id: 4020, cat: PC/0day, desc: "Operating System"}
    - {id: 4050, cat: PC/Games, desc: "Games"}
    - {id: 4070, cat: PC/Mobile-Other, desc: "Mobile Apps"}
    - {id: 5000, cat: TV, desc: "TV"}
    - {id: 5060, cat: TV/Sport, desc: "Sports"}
    - {id: 5070, cat: TV/Anime, desc: "Anime"}
    - {id: 7020, cat: Books/EBook, desc: "EBooks"}
    - {id: 7030, cat: Books/Comics, desc: "Comics"}
    - {id: 8000, cat: Other, desc: "Other"}
    - {id: 8010, cat: Other, desc: "Tutorials"}

  modes:
    search: [q]

settings:
  - name: apikey
    type: text
    label: API Key
  - name: info_key
    type: info
    label: About your API Key
    default: "You can generate your API Key by accessing the <a href=\"https://bytepeer.net/tracker\" target=\"_blank\">BytePeer tracker</a> page."

login:
  # returns a torznab <error code="100"> for a bad key
  path: torznab/api
  method: get
  inputs:
    t: search
    limit: 1
  error:
    - selector: error
      message:
        selector: error[description]
        attribute: description

search:
  paths:
    - path: torznab/api
      response:
        type: xml

  inputs:
    t: search
    q: "{{ .Keywords }}"
    cat: "{{ join .Categories \",\" }}"
    limit: 100

  headers:
    Authorization: ["Bearer {{ .Config.apikey }}"]

  rows:
    selector: rss > channel > item
    filters:
      - name: andmatch

  fields:
    category:
      selector: "[name=category]"
      attribute: value
    title:
      selector: title
    details:
      selector: comments
    download:
      selector: enclosure
      attribute: url
    infohash:
      selector: "[name=infohash]"
      attribute: value
    date:
      # Wed, 11 Nov 2026 18:56:33 GMT
      selector: pubDate
      filters:
        - name: replace
          args: ["GMT", "+00:00"]
        - name: dateparse
          args: "ddd, dd MMM yyyy HH:mm:ss zzz"
    size:
      selector: "[name=size]"
      attribute: value
    seeders:
      selector: "[name=seeders]"
      attribute: value
    leechers:
      selector: "[name=peers]"
      attribute: value
    downloadvolumefactor:
      selector: "[name=downloadvolumefactor]"
      attribute: value
    uploadvolumefactor:
      selector: "[name=uploadvolumefactor]"
      attribute: value
    minimumseedtime:
      # 2 days (as seconds = 2 x 24 x 60 x 60)
      text: 172800
# torznab xml
