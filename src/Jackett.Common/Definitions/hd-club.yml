---
id: hd-club
name: HD-CLUB
description: "HD-CLUB is a CZECH Private Torrent Tracker for MOVIES / TV / GENERAL"
language: cs-CZ
type: private
encoding: UTF-8
links:
  - https://hd-czech.eu/
legacylinks:
  - https://freecztorrent.eu/

caps:
  categorymappings:
    - {id: 42, cat: TV, desc: "Serialy x265"}
    - {id: 11, cat: Movies/HD, desc: "H265-720/1080/1440/2160"}
    - {id: 19, cat: TV/Anime, desc: "Anime 720p - 4k"}
    - {id: 32, cat: TV/Documentary, desc: "Dokumenty Series"}
    - {id: 28, cat: TV, desc: "Seriály X264"}
    - {id: 33, cat: TV/Documentary, desc: "Dokumenty"}
    - {id: 14, cat: TV/WEB-DL, desc: "TV - WEB- DL x264"}
    - {id: 15, cat: TV/WEB-DL, desc: "TV - WEB- DL x265"}
    - {id: 38, cat: XXX, desc: "XXX"}
    - {id: 23, cat: Movies/UHD, desc: "Bluray / 4K-UHD"}
    - {id: 26, cat: Movies/HD, desc: "H264-720/1080/1440/2160"}
    - {id: 18, cat: TV/HD, desc: "Film Retro"}
    - {id: 35, cat: Movies, desc: "V.I.P Extra"}

  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]

settings:
  - name: username
    type: text
    label: Username
  - name: password
    type: password
    label: Password
  - name: ip_filtering
    type: info
    label: "IP Filtering"
    default: "HD-CLUB allows only certain IP addressess. The error <b>Redirected to https://hd-czech.eu/blocked.php?country=xx</b> means your IP was not accepted."
  - name: freeleech
    type: checkbox
    label: Search freeleech only
    default: false
  - name: sort
    type: select
    label: Sort requested from site
    default: 3
    options:
      3: created
      5: seeders
      4: size
      2: title
  - name: type
    type: select
    label: Order requested from site
    default: 2
    options:
      2: desc
      1: asc
  - name: info
    type: info
    label: Results Per Page
    default: For best results, change the <b>Torrents per page:</b> setting to <b>100</b> on your account profile.

login:
  method: post
  path: index.php?page=login
  inputs:
    uid: "{{ .Config.username }}"
    pwd: "{{ .Config.password }}"
  error:
    - selector: td.lista span[style="color:#FF0000;"]
  test:
    path: index.php
    selector: a[href="logout.php"]

search:
  paths:
    # https://freecztorrent.eu/index.php?page=torrents&active=0&category=26;29&order=3&by=2
    - path: index.php
  inputs:
    page: torrents
    search: "{{ .Keywords }}"
    category: "{{ if .Categories }}{{ range .Categories }}{{.}};{{end}}{{ else }}0{{ end }}"
    # 0 all, 1 active only, 2 dead only
    active: 0
    order: "{{ .Config.sort }}"
    by: "{{ .Config.type }}"

  rows:
    selector: table.benylista > tbody > tr:has(a[href^="download.php"]):not(:has(a[href$="category=0"]))

  fields:
    category:
      selector: a[href*="category="]
      attribute: href
      filters:
        - name: querystring
          args: category
    title:
      selector: a[href^="index.php?page=torrent-details"]
    details:
      selector: a[href^="index.php?page=torrent-details"]
      attribute: href
    download:
      selector: a[href^="download.php"]
      attribute: href
    poster:
      selector: img.small-img
      attribute: src
    date:
      # 21.03.2026 21:50:07<br>Smaže se za<br>2 Mesicu, 3 Tydny, 5 Hodin
      selector: td:nth-last-child(7)
      # auto adjusted by site account profile
      filters:
        - name: regexp
          args: (\d{2}\.\d{2}\.\d{4} \d{2}:\d{2}:\d{2})
        - name: dateparse
          args: "dd.MM.yyyy HH:mm:ss"
    size:
      selector: td:nth-last-child(6)
    seeders:
      selector: td:nth-last-child(5)
    leechers:
      selector: td:nth-last-child(4)
    grabs:
      selector: td:nth-last-child(3)
    _exclusive:
      optional: true
      case:
        img[src="beny/exclusive.png"]: Exclusive
    _vip:
      optional: true
      case:
        img[src="gold/free.gif"]: VIP
    description:
      text: "{{ if .Result._exclusive }}{{ .Result._exclusive }} {{ else }}{{ end }}{{ if .Result._vip }}{{ .Result._vip }}{{ else }}{{ end }}"
    downloadvolumefactor:
      case:
        img[src="gold/gold.gif"]: 0
        img[src="gold/gold75.gif"]: 0.25
        img[src="gold/gold50.gif"]: 0.5
        img[src="gold/gold25.gif"]: 0.75
        "*": 1
    uploadvolumefactor:
      text: 1
    minimumratio:
      text: 0.6
# xbtit v2.0.1
