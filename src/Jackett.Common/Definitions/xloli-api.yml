---
id: xloli-api
name: xloli (API)
description: "xloli (ilolicon PT) is a CHINESE Private Torrent Tracker for LOLICON / MOVIES / 3X"
language: zh-CN
type: private
encoding: UTF-8
requestDelay: 2
links:
  - https://mua.xloli.cc/
legacylinks:
  - https://share.ilolicon.com/

caps:
  categorymappings:
    - {id: 401, cat: Movies, desc: "电影(Movie)"}
    - {id: 402, cat: TV, desc: "电视剧(TV Series)"}
    - {id: 430, cat: TV, desc: "综艺(TV Show)"}
    - {id: 405, cat: TV/Anime, desc: "动画(Animation)"}
    - {id: 408, cat: Audio, desc: "音乐(Music)"}
    - {id: 410, cat: Audio/Video, desc: "舞台演出(Stage Performance)"}
    - {id: 404, cat: TV/Documentary, desc: "纪录片(Documentary)"}
    - {id: 412, cat: Console, desc: "游戏(Game)"}
    - {id: 413, cat: PC, desc: "软件(Software)"}
    - {id: 411, cat: Other, desc: "漫画/CG杂图/动漫杂志(Photo)"}
    - {id: 420, cat: XXX, desc: "AV(有码/Censored)"}
    - {id: 419, cat: XXX, desc: "AV(无码/Uncensored)"}
    - {id: 423, cat: XXX/Other, desc: "里番(Hanime)"}
    - {id: 425, cat: XXX/Other, desc: "H-2D同人动画(H 2D doujin anime)"}
    - {id: 426, cat: XXX/Other, desc: "H-3D同人动画(H 3D doujin anime)"}
    - {id: 424, cat: XXX/Other, desc: "H-漫画(H Manga)"}
    - {id: 427, cat: XXX/ImageSet, desc: "H-CG杂图(H-CG)"}
    - {id: 418, cat: XXX/ImageSet, desc: "写真(Picture)"}
    - {id: 429, cat: XXX/Other, desc: "音声(Audio)"}
    - {id: 428, cat: XXX/Other, desc: "H-游戏(H Game)"}
    - {id: 422, cat: XXX, desc: "H-综艺(H TV Show)"}

  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]

settings:
  - name: apikey
    type: text
    label: API Token
  - name: info_apikey
    type: info
    label: About your API Token
    default: "Find/Generate an API token from your <a href=\"https://mua.xloli.cc/usercp.php\" target=\"_blank\">xloli</a> account control panel."
  - name: passkey
    type: text
    label: Passkey
  - name: info_passkey
    type: info
    label: About your Passkey
    default: "Find the Passkey from your account control panel."
  - name: freeleech
    type: checkbox
    label: Filter freeleech only
    default: false
  - name: sort
    type: select
    label: Sort requested from site
    default: "-id"
    options:
      "-id": created
      "-seeders": seeders
      "-size": size
      "-times_completed": grabs
  - name: info_activity
    type: info
    label: Account Inactivity
    default: "Cherish your user account. Inactive accounts would be deleted based on the following rules:<ol><li>Veteran User or above would never be deleted.</li><li>Elite User or above would never be deleted if parked (at User CP).</li><li>Parked accounts would be deleted if users have not logged in for more than 400 days in a row.</li><li>Unparked accounts would be deleted if users have not logged in for more than 150 days in a row.</li><li>Accounts with both uploaded and downloaded amount being 0 would be deleted if users have not logged in for more than 100 days in a row.</li></ol>"

login:
  path: api/v1/torrents
  method: get
  inputs:
    per_page: 1
  # this site returns 0 bytes when the api token is not accepted, which I don't think we can trap :-(
  error:
    - selector: :root:contains("login.php?returnto")
      message:
        text: "The API token was not accepted by {{ .Config.sitelink }}."
    - selector: :root:contains("Unauthenticated")
      message:
        text: "The API token was not accepted by {{ .Config.sitelink }}."

search:
  paths:
    - path: api/v1/torrents
      response:
        type: json

  headers:
    Authorization: ["Bearer {{ .Config.apikey }}"]

  inputs:
    $raw: "{{ range .Categories }}&filter[category][in][]={{.}}{{end}}"
    "filter[title]": "{{ .Keywords }}"
    sorts: "{{ .Config.sort }}"
    per_page: 100

  keywordsfilters:
    # the site stores dotted release names but the title filter matches on words
    - name: re_replace
      args: ["\\.", " "]

  rows:
    selector: "data.data{{ if .Config.freeleech }}:not(promotion_info.down_multiplier:contains(1)):not(promotion_info.down_multiplier:contains(.)){{ else }}{{ end }}"

  fields:
    category:
      selector: category
    _id:
      selector: id
    title:
      selector: name
    details:
      text: "{{ .Config.sitelink }}details.php?id={{ .Result._id }}&hit=1"
    download:
      text: "{{ .Config.sitelink }}download.php?id={{ .Result._id }}&passkey={{ .Config.passkey }}"
    infohash:
      selector: hash
    poster:
      selector: cover
    description:
      selector: small_descr
    size:
      selector: size
    files:
      selector: numfiles
    seeders:
      selector: seeders
    leechers:
      selector: leechers
    grabs:
      selector: times_completed
    date:
      # 2026-09-19 16:50
      selector: added
      filters:
        - name: append
          args: " +08:00" # CST
        - name: dateparse
          args: "yyyy-MM-dd HH:mm zzz"
    downloadvolumefactor:
      # promotion_info is the EFFECTIVE promotion and accounts for site-wide freeleech events.
      # sp_state is only the stored per-torrent promotion, so it reads 1 on a torrent the site has made free.
      selector: promotion_info.down_multiplier
    uploadvolumefactor:
      selector: promotion_info.up_multiplier
# JSON API NexusPHP v1.10.2 2026-04-11
