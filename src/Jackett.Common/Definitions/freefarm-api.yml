---
id: freefarm-api
name: Free Farm (自由农场) (API)
description: "Free Farm (自由农场) is a CHINESE Private Torrent Tracker for MOVIES / TV / GENERAL"
language: zh-CN
type: private
encoding: UTF-8
links:
  - https://pt.0ff.cc/

caps:
  categorymappings:
    - {id: 401, cat: Movies, desc: "Movies|电影"}
    - {id: 402, cat: TV, desc: "TV Series|电视剧"}
    - {id: 403, cat: TV/Documentary, desc: "Documentaries|纪录片"}
    - {id: 404, cat: TV, desc: "TV Shows|综艺"}
    - {id: 405, cat: TV/Anime, desc: "Animations|动漫"}
    - {id: 406, cat: Audio/Video, desc: "Music Videos|音乐视频"}
    - {id: 407, cat: Audio/Lossless, desc: "HD Music|无损音乐"}
    - {id: 408, cat: TV/Sport, desc: "Sports|体育"}
    - {id: 427, cat: Other/Misc, desc: "待定"}
    - {id: 412, cat: Other/Misc, desc: "待定"}
    - {id: 411, cat: Other/Misc, desc: "待定"}
    - {id: 410, cat: Other/Misc, desc: "待定"}
    - {id: 409, cat: Other/Misc, desc: "待定"}
    - {id: 428, cat: Other, desc: "Others|其他"}
    - {id: 413, cat: Other, desc: "Education|学习教育"}
    - {id: 414, cat: Other, desc: "Course|网络教程"}
    - {id: 415, cat: Books, desc: "book|书籍"}
    - {id: 416, cat: PC/0day, desc: "Resources|网络资源"}
    - {id: 417, cat: PC/Games, desc: "Game|游戏"}
    - {id: 425, cat: Other/Misc, desc: "待定"}
    - {id: 424, cat: Other/Misc, desc: "待定"}
    - {id: 423, cat: Other/Misc, desc: "待定"}
    - {id: 422, cat: Other/Misc, desc: "待定"}
    - {id: 421, cat: Other/Misc, desc: "待定"}
    - {id: 420, cat: Other/Misc, desc: "待定"}
    - {id: 419, cat: Other/Misc, desc: "待定"}
    - {id: 418, cat: Other/Misc, desc: "待定"}
    - {id: 426, cat: Other, desc: "Others|其他"}

  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]
    book-search: [q]

settings:
  - name: apikey
    type: text
    label: API Token
  - name: info_apikey
    type: info
    label: About your API Token
    default: "Find/Generate an API token from your <a href=\"https://pt.0ff.cc/usercp.php\" target=\"_blank\">Free Farm</a> account control panel."
  - name: passkey
    type: text
    label: Passkey
  - name: info_passkey
    type: info
    label: About your Passkey
    default: "Find the Passkey from your account control panel."
  - name: freeleech
    type: checkbox
    label: Filter freeleech only
    default: false
  - name: sort
    type: select
    label: Sort requested from site
    default: "-id"
    options:
      "-id": created
      "-seeders": seeders
      "-size": size
      "-times_completed": grabs
  - name: info_activity
    type: info
    label: Account Inactivity
    default: "Cherish your user account. Inactive accounts would be deleted based on the following rules:<ol><li>Veteran User or above would never be deleted.</li><li>Elite User or above would never be deleted if parked (at User CP).</li><li>Parked accounts would be deleted if users have not logged in for more than 400 days in a row.</li><li>Unparked accounts would be deleted if users have not logged in for more than 150 days in a row.</li><li>Accounts with both uploaded and downloaded amount being 0 would be deleted if users have not logged in for more than 100 days in a row.</li></ol>"

login:
  path: api/v1/torrents
  method: get
  inputs:
    per_page: 1
  error:
    - selector: :root:contains("login.php?returnto")
      message:
        text: "The API token was not accepted by {{ .Config.sitelink }}."
    - selector: :root:contains("Unauthenticated")
      message:
        text: "The API token was not accepted by {{ .Config.sitelink }}."

search:
  paths:
    - path: api/v1/torrents
      response:
        type: json

  headers:
    Authorization: ["Bearer {{ .Config.apikey }}"]

  inputs:
    $raw: "{{ range .Categories }}&filter[category][in][]={{.}}{{end}}"
    "filter[title]": "{{ .Keywords }}"
    sorts: "{{ .Config.sort }}"
    per_page: 100

  keywordsfilters:
    # the site stores dotted release names but the title filter matches on words
    - name: re_replace
      args: ["\\.", " "]

  rows:
    selector: "data.data{{ if .Config.freeleech }}:not(promotion_info.down_multiplier:contains(1)):not(promotion_info.down_multiplier:contains(.)){{ else }}{{ end }}"

  fields:
    category:
      selector: category
    _id:
      selector: id
    title:
      selector: name
    details:
      text: "{{ .Config.sitelink }}details.php?id={{ .Result._id }}&hit=1"
    download:
      text: "{{ .Config.sitelink }}download.php?id={{ .Result._id }}&passkey={{ .Config.passkey }}"
    infohash:
      selector: hash
    poster:
      selector: cover
    description:
      selector: small_descr
    size:
      selector: size
    files:
      selector: numfiles
    seeders:
      selector: seeders
    leechers:
      selector: leechers
    grabs:
      selector: times_completed
    date:
      # 2026-09-19 16:50
      selector: added
      filters:
        - name: append
          args: " +08:00" # CST
        - name: dateparse
          args: "yyyy-MM-dd HH:mm zzz"
    downloadvolumefactor:
      # promotion_info is the EFFECTIVE promotion and accounts for site-wide freeleech events.
      # sp_state is only the stored per-torrent promotion, so it reads 1 on a torrent the site has made free.
      selector: promotion_info.down_multiplier
    uploadvolumefactor:
      selector: promotion_info.up_multiplier
    minimumseedtime:
      # special 7 days (as seconds = 7 x 24 x 60 x 60)
      # normal 3 days (as seconds = 3 x 24 x 60 x 60)
      selector: hr
      case:
        1: 604800
        0: 259200
# JSON API NexusPHP v1.10.2 2026-04-11
