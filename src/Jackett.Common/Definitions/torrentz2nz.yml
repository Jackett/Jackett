---
id: torrentz2nz
name: Torrentz2nz
description: "Torrentz2nz is a Public torrent meta-search engine"
language: en-US
type: public
encoding: UTF-8
links:
  - https://torrentz2.nz/
legacylinks:
  - https://torrentz2.mrunblock.bond/
  - https://torrentz2.nocensor.cloud/

caps:
  # unfortunately torrentz2nz categorises most results as Other in its search results page :-(
  categorymappings:
    - {id: 1, cat: Other, desc: "Other"}
    - {id: 2, cat: Movies, desc: "Movies"}
    - {id: 3, cat: TV, desc: "TV"}

  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]

settings:
  - name: info_category_8000
    type: info_category_8000
  - name: sort
    type: select
    label: Sort requested from site
    default: date
    options:
      date: created
      peers: seeders
      size: size

download:
  selectors:
    - selector: a[href^="magnet:?xt"]
      attribute: href

search:
  paths:
    - path: "{{ if .Keywords }}search?q={{ .Keywords }}&sort={{ .Config.sort }}{{ else }}latest{{ end }}"

  rows:
    selector: dl

  fields:
    category:
      text: 1
    title:
      selector: dt a
    details:
      selector: dt a
      attribute: href
    download:
      selector: dt a
      attribute: href
    date:
      selector: dd span.a
      filters:
        - name: replace
          args: ["s ", "seconds "]
        - name: replace
          args: ["m ", "minutes "]
        - name: replace
          args: ["d ", "days "]
        - name: replace
          args: ["mo ", "months "]
        - name: replace
          args: ["y ", "years "]
        - name: timeago
    size:
      selector: dd span.s
    seeders:
      selector: dd span.u
    leechers:
      selector: dd span.d
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
# engine n/a
