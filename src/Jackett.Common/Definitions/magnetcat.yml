  - https://www.8800577.xyz/
  - https://www.8800579.xyz/
  - https://www.8800580.xyz/
  - https://www.8800581.xyz/
  - https://www.8800578.xyz/
  - https://www.8800582.xyz/
  - https://www.8800583.xyz/
  - https://www.8800584.xyz/
  - https://www.8800585.xyz/
  - https://www.8800586.xyz/
  - https://www.8800588.xyz/
  - https://www.8800587.xyz/
  - https://www.8800589.xyz/
  - https://www.8800590.xyz/

caps:
  categorymappings:
    - {id: 影视, cat: TV, desc: 影视}
    - {id: 影视, cat: Movies, desc: 影视}
    - {id: 音乐, cat: Audio, desc: 音乐}
    - {id: 图像, cat: Other, desc: 图像}
    - {id: 文档书籍, cat: Books, desc: 文档书籍}
    - {id: 压缩文件, cat: Other, desc: 压缩文件}
    - {id: 安装包, cat: PC, desc: 安装包}
    - {id: 其他, cat: Other, desc: 其他}

  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]
    book-search: [q]

settings:
  - name: cat-id
    type: select
    label: Category
    default: 0
    options:
      0: 全部(All categories)
      1: 影视(Movies and TV shows)
      2: 音乐(Music)
      3: 图像(Images)
      4: 文档书籍(Documents)
      5: 压缩文件(Archives)
      6: 安装包(Apps)
      7: 其他(Other)
  - name: sort
    type: select
    label: Sort requested from site
    default: 2
    options:
      2: created
      1: size
      0: relevance

search:
  paths:
    - path: "search-{{ if .Keywords }}{{ .Keywords }}{{ else }}{{ .Today.Year }}{{ end }}-{{ .Config.cat-id }}-{{ .Config.sort }}-1.html"
  error:
    - selector: :root:contains("Internal Server Error")

  rows:
    selector: article

  fields:
    categorydesc:
      selector: span:first-child
      filters:
        - name: re_replace
          args: ["分类：", ""]
        - name: re_replace
          args: ["Category：", ""]
    title:
      selector: a[href^="/hash/"]
    details:
      selector: a[href^="/hash/"]
      attribute: href
    infohash:
      selector: a[href^="/hash/"]
      attribute: href
      filters:
        - name: regexp
          args: ([A-F|a-f|0-9]{40})
    date:
      selector: span:nth-child(2)
      filters:
        - name: re_replace
          args: ["添加时间：", ""]
        - name: append
          args: " +08:00" # CST
        - name: dateparse
          args: "yyyy-MM-dd zzz"
    size:
      selector: span:nth-child(3)
      filters:
        - name: re_replace
          args: ["大小：", ""]
    files:
      selector: span:nth-child(5)
      filters:
        - name: re_replace
          args: ["文件：", ""]
    seeders:
      text: 1
    leechers:
      text: 1
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
# engine n/a
