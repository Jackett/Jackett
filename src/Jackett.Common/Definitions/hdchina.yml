---
id: hdchina
name: HDChina
description: "HDChina (HDWing) is a CHINESE Private Torrent Tracker for HD MOVIES / TV"
language: zh-CN
type: private
encoding: UTF-8
links:
  - https://hdwing.org/
legacylinks:
  - https://hdchina.club/
  - https://hdchina.org/

caps:
  categorymappings:
    - {id: 20, cat: Movies/BluRay, desc: "原盘(Full BD)"}
    - {id: 17, cat: Movies/HD, desc: "电影Movie(1080p)"}
    - {id: 16, cat: Movies/HD, desc: "电影Movie(1080i)"}
    - {id: 9, cat: Movies/HD, desc: "电影Movie(720p)"}
    - {id: 13, cat: TV, desc: "欧美剧(EU/US TV series)"}
    - {id: 25, cat: TV, desc: "中港台剧集(Chinese TV series)"}
    - {id: 26, cat: TV, desc: "韩剧(Kor Drama)"}
    - {id: 24, cat: TV, desc: "日剧(Jpn Drama)"}
    - {id: 21, cat: TV, desc: "欧美剧集包(EU/US TV series pack)"}
    - {id: 22, cat: TV, desc: "中港台剧集包(Chinese TV series pack)"}
    - {id: 23, cat: TV, desc: "日韩剧集包(JPN/KOR drama pack)"}
    - {id: 27, cat: Movies/SD, desc: "日韩剧集包(JPN/KOR drama pack)"}
    - {id: 5, cat: TV/Documentary, desc: "纪录片(Documentary)"}
    - {id: 15, cat: TV/Sport, desc: "体育节目(Sports)"}
    - {id: 14, cat: TV/Anime, desc: "动画片(Animation)"}
    - {id: 401, cat: TV, desc: "综艺(TV Shows)"}
    - {id: 402, cat: Audio, desc: "演唱会(Vocal Concert)"}
    - {id: 406, cat: Audio, desc: "MV(Music Video)"}
    - {id: 408, cat: Audio, desc: "音乐(Music)"}
    - {id: 19, cat: Audio, desc: "补充音轨(Audio Track)"}
    - {id: 405, cat: Audio, desc: "戏剧(Drama)"}
    - {id: 404, cat: Books, desc: "书籍(Book)"}
    - {id: 409, cat: Other, desc: "其他(Other)"}
    - {id: 410, cat: Movies/HD, desc: "4K UltraHD"}
    - {id: 411, cat: TV, desc: "旅游(Travel)"}
    - {id: 412, cat: TV, desc: "饮食(Food)"}

  modes:
    search: [q]
    tv-search: [q, season, ep, imdbid]
    movie-search: [q, imdbid]
    music-search: [q]
    book-search: [q]

settings:
  - name: cookie
    type: text
    label: Cookie
  - name: info_cookie
    type: info_cookie
  - name: info_tpp
    type: info
    label: Results Per Page
    default: For best results, change the <b>Torrents per page:</b> setting to <b>100</b> on your account profile.

login:
  # using cookie method because login page has embedded Cloudflare turnstile
  method: cookie
  inputs:
    cookie: "{{ .Config.cookie }}"
  test:
    path: torrents.php
    selector: a[href^="logout.php"]

search:
  paths:
    - path: torrents.php
  inputs:
    $raw: "{{ range .Categories }}cat{{.}}=1&{{end}}"
    search: "{{ if .Query.IMDBID }}{{ .Query.IMDBID }}{{ else }}{{ .Keywords }}{{ end }}"
    # 0=incldead, 1=active, 2=dead
    incldead: 0
    # 0=all, 1=normal, 2=free, 3=2x, 4=2x free, 5=50%, 6=2x 50%, 7=30%
    spstate: 0
    # 0=title, 1=descr, 3=uploader, 4=imdb URL
    search_area: "{{ if .Query.IMDBID }}4{{ else }}0{{ end }}"
    # 0=AND, 1=OR, 2=Exact
    search_mode: 0
    notnewword: 1

  rows:
    selector: table.torrent_list > tbody > tr:has(a[href*="?cat="])

  fields:
    category:
      selector: a[href*="?cat="]
      attribute: href
      filters:
        - name: querystring
          args: cat
    title:
      selector: a[href*="details.php?id="]
      filters:
        - name: re_replace
          args: ["\\.", " "]
    details:
      selector: a[href*="details.php?id="]
      attribute: href
    download:
      selector: a[href*="download.php?hash="]
      attribute: href
    description:
      selector: h4
    size:
      selector: td.t_size
    grabs:
      selector: td.t_completed
    seeders:
      selector: td.t_torrents
    leechers:
      selector: td.t_leech
    date_elapsed:
      # time type: time elapsed (default)
      selector: td.t_time > span[title]
      attribute: title
      optional: true
      filters:
        - name: append
          args: " +08:00" # CST
        - name: dateparse
          args: "yyyy-MM-dd HH:mm:ss zzz"
    date_added:
      # time added
      selector: td.t_time:not(:has(span))
      optional: true
      filters:
        - name: append
          args: " +08:00" # CST
        - name: dateparse
          args: "yyyy-MM-ddHH:mm:ss zzz"
    date:
      text: "{{ if or .Result.date_elapsed .Result.date_added }}{{ or .Result.date_elapsed .Result.date_added }}{{ else }}now{{ end }}"
    downloadvolumefactor:
      # DLVF and ULVF are dynamically presented via javascript so not available to cardigann
      text: 1
    uploadvolumefactor:
      text: 1
# NexusPHP 9adc6dc (Customised)
