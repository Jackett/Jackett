---
id: fileiplay
name: FileIplay
description: "FileIplay is a Private Torrent Tracker for MOVIES / TV / GENERAL"
language: en-US
type: private
encoding: UTF-8
requestDelay: 2
links:
  - https://fileiplay.org/

caps:
  # dont forget to update the path categories in the search block
  categorymappings:
    - {id: 54, cat: Movies/WEB-DL, desc: "WEB-DL", default: true}
    - {id: 55, cat: Movies/WEB-DL, desc: "WEB-DL RO", default: true}
    - {id: 31, cat: Movies/UHD, desc: "4K", default: true}
    - {id: 32, cat: Movies/UHD, desc: "4KRO", default: true}
    - {id: 1, cat: Movies, desc: "Anime", default: true}
    - {id: 2, cat: Movies, desc: "Anime-Ro", default: true}
    - {id: 5, cat: Movies/BluRay, desc: "BluRay", default: true}
    - {id: 6, cat: Movies/BluRay, desc: "BluRay-Ro", default: true}
    - {id: 9, cat: Movies/DVD, desc: "DVD", default: true}
    - {id: 10, cat: Movies/DVD, desc: "DVD-Ro", default: true}
    - {id: 11, cat: Movies/HD, desc: "HD", default: true}
    - {id: 12, cat: Movies/HD, desc: "HD-Ro", default: true}
    - {id: 16, cat: Movies/SD, desc: "Old", default: true}
    - {id: 17, cat: Movies/SD, desc: "Old-Ro", default: true}
    - {id: 18, cat: Movies/Other, desc: "Pack", default: true}
    - {id: 19, cat: Movies/Other, desc: "Pack-Ro", default: true}
    - {id: 82, cat: Movies/HD, desc: "x265", default: true}
    - {id: 81, cat: Movies/HD, desc: "x265-Ro", default: true}
    - {id: 24, cat: Movies/SD, desc: "XVID", default: true}
    - {id: 25, cat: Movies/SD, desc: "XVID-Ro", default: true}
    - {id: 13, cat: TV/HD, desc: "HDTV Episodes", default: true}
    - {id: 14, cat: TV/HD, desc: "HDTV Episodes-Ro", default: true}
    - {id: 20, cat: TV, desc: "TV Episodes", default: true}
    - {id: 21, cat: TV, desc: "TV Episodes-Ro", default: true}
    - {id: 28, cat: Audio, desc: "Music", default: true}
    - {id: 33, cat: PC/Games, desc: "Games Pack", default: true}
    - {id: 30, cat: PC/Games, desc: "Games PC-ISO", default: true}
    - {id: 51, cat: PC/Mobile-Android, desc: "Android Apps", default: true}
    - {id: 26, cat: PC/0day, desc: "Software", default: true}
    - {id: 49, cat: Other, desc: "Diverse", default: true}
    - {id: 56, cat: TV/Documentary, desc: "Documentary", default: true}
    - {id: 57, cat: TV/Documentary, desc: "Documentary-Ro", default: true}
    - {id: 43, cat: Other, desc: "Documents", default: true}
    - {id: 44, cat: Other, desc: "Images", default: true}
    - {id: 22, cat: Other, desc: "RoContent", default: true}
    - {id: 42, cat: TV/Sport, desc: "Sport", default: true}
    - {id: 27, cat: XXX/x264, desc: "XXX", default: false}
    - {id: 34, cat: XXX/Pack, desc: "XXX Pack", default: false}
    - {id: 60, cat: XXX/ImageSet, desc: "ImagesXXX", default: false}

  modes:
    search: [q]
    tv-search: [q, season, ep, imdbid]
    movie-search: [q, imdbid]
    music-search: [q]
    book-search: [q]

settings:
  - name: username
    type: text
    label: Username
  - name: password
    type: password
    label: Password
  - name: freeleech
    type: checkbox
    label: Search freeleech only
    default: false
  - name: sort
    type: select
    label: Sort requested from site
    default: created_at
    options:
      created_at: created
      seeders: seeders
      size: size
      1: title
  - name: type
    type: select
    label: Order requested from site
    default: desc
    options:
      desc: desc
      asc: asc

login:
  path: login
  method: form
  form: form
  inputs:
    name: "{{ .Config.username }}"
    password: "{{ .Config.password }}"
  error:
    - selector: div.alert-danger:contains("Invalid credentials")
  test:
    path: /
    selector: a[href$="/logout"]

search:
  paths:
    # https://fileiplay.org/torrents?keyword=&genre=&torrent_status=free&categories[]=54&categories[]=13
    - path: torrents
      categories: [54, 55, 31, 32, 1, 2, 5, 6, 9, 10, 11, 12, 16, 17, 18, 19, 82, 81, 24, 25, 13, 14, 20, 21, 28, 33, 30, 51, 26, 49, 56, 57, 43, 44, 22, 42]
    # https://fileiplay.org/torrents/adult
    - path: torrents/adult
      categories: [27, 34, 60]

  inputs:
    $raw: "{{ range .Categories }}categories[]={{.}}&{{end}}"
    keyword: "{{ if .Query.IMDBID }}{{ .Query.IMDBID }}{{ else }}{{ .Keywords }}{{ end }}"
    # all, active, dead, free, double, seedbox
    torrent_status: "{{ if .Config.freeleech }}free{{ else }}all{{ end }}"
    sort: "{{ .Config.sort }}"
    direction: "{{ .Config.type }}"

  rows:
    selector: table.tx-table > tbody > tr

  fields:
    category:
      selector: a[href*="categories%5B0%5D="]
      attribute: href
      filters:
        - name: regexp
          args: =(\d+)&
    title:
      selector: a[href*="/torrents/"]
    details:
      selector: div.torrent-title-line a
      attribute: href
    download:
      selector: a[href*="/torrents/download/"]
      attribute: href
    poster:
      selector: a[href*="/torrents/"]
      attribute: data-bs-title
      filters:
        - name: regexp
          args: src='(.+?)'
    date:
      # 2026-09-26T15:24:29+00:00
      selector: time
      attribute: datetime
      filters:
        - name: dateparse
          args: "yyy-MM-ddHH:mm:sszzz"
    size:
      selector: td[data-label="Size"]
    seeders:
      selector: span.tx-seeders
    leechers:
      selector: span.tx-leechers
    grabs:
      selector: td[data-label="Completed"]
    downloadvolumefactor:
      case:
        div.free-btn: 0
        "*": 1
    uploadvolumefactor:
      case:
        div.double-btn: 2
        "*": 1
    minimumratio:
      text: 1.0
    minimumseedtime:
      # 12h (as seconds = 12 x 60 x 60)
      text: 43200
# engine n/a
