---
id: fileiplay
name: FileIplay
description: "FileIplay is a Private Torrent Tracker for MOVIES / TV / GENERAL"
language: en-US
type: private
encoding: UTF-8
links:
  - https://fileiplay.org/

caps:
  categorymappings:
    # https://fileiplay.org/torznab/api?t=caps&apikey=YOUR-API-KEY
    - {id: 2000, cat: Movies, desc: "Movies"}
    - {id: 3000, cat: Audio, desc: "Audio"}
    - {id: 4000, cat: PC, desc: "PC"}
    - {id: 5000, cat: TV, desc: "TV"}
    - {id: 7000, cat: Other, desc: "Other"}

  modes:
    search: [q]
    tv-search: [q, season, ep, imdbid, tmdbid, tvdbid]
    movie-search: [q, imdbid, tmdbid, year]
  allowtvsearchimdb: true

settings:
  - name: apikey
    type: text
    label: API Key
  - name: info_key
    type: info
    label: About your API Key
    default: "You can find your API Key by accessing the <a href=\"https://fileiplay.org/integrations/\" target=\"_blank\">FileIplay Integrations</a> page and scrolling down to <b>Your integration API key</b>."

login:
  # returns "401 Unauthorized, check your credentials" if apikey is invalid
  path: torznab/api
  method: get
  inputs:
    apikey: "{{ .Config.apikey }}"
    t: caps

search:
  paths:
    - path: torznab/api
      response:
        type: xml

  inputs:
    apikey: "{{ .Config.apikey }}"
    t: "{{ if .Query.Type }}{{ .Query.Type }}{{ else }}search{{ end }}"
    q: "{{ .Keywords }}"
    cat: "{{ join .Categories \",\" }}"
    season: "{{ .Query.Season }}"
    ep: "{{ .Query.Ep }}"
    year: "{{ .Query.Year }}"
    imdbid: "{{ .Query.IMDBID }}"
    tmdbid: "{{ .Query.TMDBID }}"
    tvdbid: "{{ .Query.TVDBID }}"
    limit: 100

  rows:
    selector: rss > channel > item

  fields:
    category:
      selector: "[name=category]"
      attribute: value
    title:
      selector: title
    details:
      selector: comments
    download:
      selector: enclosure
      attribute: url
    date:
      # Mon, 05 Oct 2026 04:55:57 +0000
      selector: pubDate
      filters:
        - name: dateparse
          args: "ddd, dd MMM yyyy HH:mm:ss zzz"
    size:
      selector: "[name=size]"
      attribute: value
    imdbid:
      selector: "[name=imdb]"
      attribute: value
    tmdbid:
      selector: "[name=tmdbid]"
      attribute: value
    tvdbid:
      selector: "[name=tvdbid]"
      attribute: value
    seeders:
      selector: "[name=seeders]"
      attribute: value
    leechers:
      selector: "[name=peers]"
      attribute: value
    grabs:
      selector: "[name=grabs]"
      attribute: value
    downloadvolumefactor:
      selector: "[name=downloadvolumefactor]"
      attribute: value
    uploadvolumefactor:
      selector: "[name=uploadvolumefactor]"
      attribute: value
    minimumratio:
      text: 1.0
    minimumseedtime:
      # 12h (as seconds = 12 x 60 x 60)
      text: 43200
# torznab xml
