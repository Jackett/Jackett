---
id: zxxclub
name: ZXX CLUB
description: "ZXX CLUB is a FRENCH Private Torrent Tracker for MOVIES / TV / GENERAL"
language: fr-FR
type: private
encoding: UTF-8
links:
  - https://zxxclub.com/
caps:
  categorymappings:
    # from https://zxxclub.com/api/torznab?t=caps&apikey=YOUR-API-KEY
    - {id: 2000, cat: Movies, desc: Films}
    - {id: 5000, cat: TV, desc: Séries}
    - {id: 3000, cat: Audio, desc: Musique}
    - {id: 7000, cat: Books, desc: Livres}
    - {id: 4000, cat: PC, desc: Logiciels}
    - {id: 1000, cat: Console, desc: Jeux}
    - {id: 8000, cat: Other, desc: Autres}
  modes:
    search: [q]
    tv-search: [q, season, ep, tmdbid]
    movie-search: [q, tmdbid, year]

settings:
  - name: apikey
    type: text
    label: API Key
  - name: info_key
    type: info
    label: About your API key
    default: "Find or Generate a new API Token by accessing your <a href=\"https://zxxclub.com/applications/\" target=\"_blank\">ZXX CLUB</a> <i>API & Applications</i> page."

login:
  # does not support headers: X-API-KEY:
  # returns a torznab <error code="100"> (401) for a bad key, <error code="101"> (402) without a membership
  path: api/torznab
  method: get
  inputs:
    t: caps
    apikey: "{{ .Config.apikey }}"
  error:
    - selector: error
      message:
        selector: error[description]
        attribute: description

search:
  paths:
    - path: api/torznab
      response:
        type: xml

  inputs:
    apikey: "{{ .Config.apikey }}"
    t: "{{ if .Query.Type }}{{ .Query.Type }}{{ else }}search{{ end }}"
    q: "{{ .Keywords }}"
    cat: "{{ join .Categories \",\" }}"
    year: "{{ .Query.Year }}"
    tmdbid: "{{ .Query.TMDBID }}"
    limit: 100

  error:
    - selector: error
      message:
        selector: error[description]
        attribute: description

  rows:
    selector: rss > channel > item

  fields:
    category:
      selector: "[name=category]"
      attribute: value
    title:
      selector: title
    details:
      selector: comments
    download:
      selector: enclosure
      attribute: url
    infohash:
      selector: "[name=infohash]"
      attribute: value
    tmdbid:
      selector: "[name=tmdbid]"
      attribute: value
    date:
      # Mon, 23 Nov 2026 01:29:48 GMT
      selector: pubDate
      filters:
        - name: replace
          args: ["GMT", "+00:00"]
        - name: dateparse
          args: "ddd, dd MMM yyyy HH:mm:ss zzz"
    size:
      selector: size
    seeders:
      selector: "[name=seeders]"
      attribute: value
    leechers:
      selector: "[name=leechers]"
      attribute: value
    downloadvolumefactor:
      selector: "[name=downloadvolumefactor]"
      attribute: value
    uploadvolumefactor:
      selector: "[name=uploadvolumefactor]"
      attribute: value
    minimumratio:
      text: 1.0
    minimumseedtime:
      # 2 days (as seconds = 2 x 24 x 60 x 60)
      text: 172800
# torznab xml
