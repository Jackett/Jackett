  modes:
    search: [q]
    tv-search: [q, season, ep]

settings:
  - name: apikey
    type: text
    label: API Key
  - name: info_key
    type: info
    label: About your API Key
    default: "Find your API key on your <a href=\"https://www.racingfor.me/user/profile#security\" target=\"_blank\">RFM Profile Security</a> page."
  - name: apiurl
    label: API URL
    type: text
    default: api.racingfor.me

login:
  # returns "401 Unauthorized, check your credentials" if apikey is invalid
  path: "https://{{ .Config.apiurl }}/public/torznab"
  method: get
  inputs:
    t: caps
    apikey: "{{ .Config.apikey }}"

search:
  paths:
    - path: "https://{{ .Config.apiurl }}/public/torznab"
      response:
        type: xml

  inputs:
    apikey: "{{ .Config.apikey }}"
    t: search
    q: "{{ .Keywords }}"
    cat: "{{ join .Categories \",\" }}"
    limit: 100

  rows:
    selector: rss > channel > item

  fields:
    category:
      selector: "[name=category]"
      attribute: value
    title:
      selector: title
    details:
      selector: guid
    download:
      selector: enclosure
      attribute: url
    infohash:
      selector: "[name=infohash]"
      attribute: value
    date:
      # Wed, 18 Nov 2026 14:50:29 +0000
      selector: pubDate
      filters:
        - name: dateparse
          args: "ddd, dd MMM yyyy HH:mm:ss zzz"
    size:
      selector: "[name=size]"
      attribute: value
    grabs:
      selector: "[name=grabs]"
      attribute: value
      optional: true
      default: 0
    seeders:
      selector: "[name=seeders]"
      attribute: value
      optional: true
      default: 0
    leechers:
      selector: "[name=peers]"
      attribute: value
      optional: true
      default: 0
    downloadvolumefactor:
      selector: "[name=downloadvolumefactor]"
      attribute: value
    uploadvolumefactor:
      selector: "[name=uploadvolumefactor]"
      attribute: value
    minimumratio:
      text: 0.5
# torznab xml
