---
id: dirtybytes
name: DirtyBytes
description: "DirtyBytes is a Private Torrent Tracker for 3X"
language: en-US
type: private
encoding: UTF-8
links:
  - https://dirtybytes.net/

caps:
  categorymappings:
    - {id: 1, cat: XXX/SD, desc: "XXX Movies/SD"}
    - {id: 2, cat: XXX/x264, desc: "XXX Movies/720p"}
    - {id: 3, cat: XXX/x264, desc: "XXX Movies/1080p"}
    - {id: 4, cat: XXX/x264, desc: "XXX Movies/1440p"}
    - {id: 5, cat: XXX/UHD, desc: "XXX Movies/2160p"}
    - {id: 6, cat: XXX/UHD, desc: "XXX Movies/4320p"}
    - {id: 7, cat: XXX/SD, desc: "XXX Scene/SD"}
    - {id: 8, cat: XXX/x264, desc: "XXX Scene/720p"}
    - {id: 9, cat: XXX/x264, desc: "XXX Scene/1080p"}
    - {id: 10, cat: XXX/x264, desc: "XXX Scene/1440p"}
    - {id: 11, cat: XXX/UHD, desc: "XXX Scene/2160p"}
    - {id: 12, cat: XXX/UHD, desc: "XXX Scene/4320p"}
    - {id: 13, cat: XXX/x264, desc: "XXX Movies/VR180/1080p"}
    - {id: 14, cat: XXX/x264, desc: "XXX Movies/VR180/1440p"}
    - {id: 15, cat: XXX/UHD, desc: "XXX Movies/VR180/2160p"}
    - {id: 16, cat: XXX/UHD, desc: "XXX Movies/VR180/2880p"}
    - {id: 17, cat: XXX/UHD, desc: "XXX Movies/VR180/3600p"}
    - {id: 18, cat: XXX/UHD, desc: "XXX Movies/VR180/4320p"}
    - {id: 19, cat: XXX/x264, desc: "XXX Scene/VR180/1080p"}
    - {id: 20, cat: XXX/x264, desc: "XXX Scene/VR180/1440p"}
    - {id: 21, cat: XXX/UHD, desc: "XXX Scene/VR180/2160p"}
    - {id: 22, cat: XXX/UHD, desc: "XXX Scene/VR180/2880p"}
    - {id: 23, cat: XXX/UHD, desc: "XXX Scene/VR180/3600p"}
    - {id: 24, cat: XXX/UHD, desc: "XXX Scene/VR180/4320p"}
    - {id: 25, cat: XXX/ImageSet, desc: "XXX Photo Sets"}
    - {id: 26, cat: XXX/Pack, desc: "XXX Packs"}

  modes:
    search: [q]

settings:
  - name: apikey
    type: text
    label: API Token
  - name: info_apikey
    type: info
    label: About your API Token
    default: "Find/Generate an API key from your <a href=\"https://dirtybytes.net/\" target=\"_blank\">DirtyBytes</a> account settings page, at the <b>Security</b> tab, in the <b>API Key</b> section."
  - name: passkey
    type: text
    label: Passkey
  - name: info_passkey
    type: info
    label: About your Passkey
    default: "Find the <b>Passkey</b> just above the <i>API key</i> section."
  - name: freeleech
    type: checkbox
    label: Search freeleech only
    default: false
  - name: sort
    type: select
    label: Sort requested from site
    default: d
    options:
      d: created
      up: seeders
      s: size
      n: title
  - name: type
    type: select
    label: Order requested from site
    default: desc
    options:
      desc: desc
      asc: asc

login:
  # returns "401 Unauthorized, check your credentials" if apikey is invalid
  path: api/v1/torrents
  method: get
  inputs:
    limit: 1

search:
  paths:
    - path: api/v1/torrents
      response:
        type: json

  inputs:
    # https://dirtybytes.net/api/v1/torrents?categories[]=1&index=0&limit=100&page=search&searchText=bukkake&section=all&sort=d&order=desc&freeleech=true&dead=true
    $raw: "{{ range .Categories }}categories[]={{.}}&{{end}}"
    index: 0
    limit: 100
    page: search
    searchText: "{{ .Keywords }}"
    section: all
    sort: "{{ .Config.sort }}"
    order: "{{ .Config.type }}"
    freeleech: "{{ if .Config.freeleech }}true{{ else }}{{ end }}"
    dead: true

  headers:
    Authorization: ["Bearer {{ .Config.apikey }}"]

  rows:
    selector: $

  fields:
    category:
      selector: category
    _id:
      selector: id
    title:
      selector: name
    details:
      # https://dirtybytes.net/torrent/49
      text: "{{ .Config.sitelink }}torrent/{{ .Result._id }}"
    download:
      # https://dirtybytes.net/api/v1/torrents/download/49/passkeycode
      text: "{{ .Config.sitelink }}api/v1/torrents/download/{{ .Result._id }}/{{ .Config.passkey }}"
    poster:
      selector: firstpic
    size:
      selector: size
    files:
      selector: numfiles
    seeders:
      selector: seeders
    leechers:
      selector: leechers
    grabs:
      selector: times_completed
    date:
      # 2026-10-02 23:25:59
      selector: added
      filters:
        - name: append
          args: " +02:00" # CEST
        - name: dateparse
          args: "yyyy-MM-dd HH:mm:ss zzz"
    downloadvolumefactor:
      selector: frileech
    uploadvolumefactor:
      text: 1
    minimumratio:
      text: 1.0
    minimumseedtime:
      # 5 day (as seconds = 5 x 24 x 60 x 60)
      text: 432000
# JSON API
