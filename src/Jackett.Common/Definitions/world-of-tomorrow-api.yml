    - {id: 1023, cat: TV/Sport, desc: "Sport / Wrestling"}

  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q, imdbid, tmdbid]
    music-search: [q]
    book-search: [q]

settings:
  - name: apikey
    type: text
    label: API Key
  - name: info_key
    type: info
    label: About your API Key
    default: "You can find your API Key by accessing your <a href=\"https://w-o-t.pro/my.php\" target=\"_blank\">World-of-Tomorrow profile</a> and scrolling down to <b>Apps & Automationen</b>."
  - name: info_activity
    type: info
    label: Account Inactivity
    default: "All accounts up to platinum users that are inactive for more than 8 weeks will be deleted!"

login:
  # returns "401 Unauthorized, check your credentials" if apikey is invalid
  path: api/torznab.php
  method: get
  inputs:
    apikey: "{{ .Config.apikey }}"
    t: caps

search:
  paths:
    - path: api/torznab.php
      response:
        type: xml

  inputs:
    apikey: "{{ .Config.apikey }}"
    t: "{{ if or (eq .Query.Type \"movie\") (eq .Query.Type \"tvsearch\") }}{{ .Query.Type }}{{ else }}search{{ end }}"
    q: "{{ .Keywords }}"
    cat: "{{ join .Categories \",\" }}"
    season: "{{ .Query.Season }}"
    ep: "{{ .Query.Ep }}"
    imdbid: "{{ .Query.IMDBID }}"
    tmdbid: "{{ .Query.TMDBID }}"
    limit: 100

  rows:
    selector: rss > channel > item

  fields:
    category:
      selector: "[name=category]"
      attribute: value
    title:
      selector: title
    details:
      selector: comments
    download:
      selector: enclosure
      attribute: url
    date:
      # Mon, 05 Oct 2026 04:55:57 +0000
      selector: pubDate
      filters:
        - name: dateparse
          args: "ddd, dd MMM yyyy HH:mm:ss zzz"
    size:
      selector: "[name=size]"
      attribute: value
    imdbid:
      selector: "[name=imdb]"
      attribute: value
    tmdbid:
      selector: "[name=tmdbid]"
      attribute: value
    seeders:
      selector: "[name=seeders]"
      attribute: value
    leechers:
      selector: "[name=peers]"
      attribute: value
    grabs:
      selector: "[name=grabs]"
      attribute: value
    downloadvolumefactor:
      selector: "[name=downloadvolumefactor]"
      attribute: value
    uploadvolumefactor:
      selector: "[name=uploadvolumefactor]"
      attribute: value
    minimumratio:
      text: 0.7
    minimumseedtime:
      # 3 days (as seconds = 3 x 24 x 60 x 60)
      text: 259200
# torznab xml
