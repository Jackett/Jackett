    - {id: 1101, cat: TV, desc: "Sonstiges / Kids"}
    - {id: 1086, cat: Other/Misc, desc: "Sonstiges / Misc"}
    - {id: 1096, cat: Other, desc: "Sonstiges / Sonstiges"}
    - {id: 1075, cat: TV/Sport, desc: "Sport / Formel 1"}
    - {id: 1074, cat: TV/Sport, desc: "Sport / Fussball"}
