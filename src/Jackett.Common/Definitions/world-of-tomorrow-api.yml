---
id: world-of-tomorrow-api
replaces:
  - world-of-tomorrow
name: World-of-Tomorrow (API)
description: "World-of-Tomorrow is a GERMAN Private tracker for MOVIES / TV / GENERAL"
language: de-DE
type: private
encoding: UTF-8
links:
  - https://w-o-t.pro/
legacylinks:
  - https://world-of-tomorrow.eu/
  - https://wotreworked.xyz/

caps:
  categorymappings:
    # from https://w-o-t.pro/api/torznab?apikey=YOUR-API-KEY&t=caps
