  modes:
    search: [q]
    tv-search: [q, season, ep, imdbid]
    movie-search: [q, imdbid]
    book-search: [q]

login:
  path: login.php
  method: post
  inputs:
    vb_login_username: "{{ .Config.username }}"
    vb_login_password: "{{ .Config.password }}"
    cookieuser: 1
    do: login
  error:
    - selector: div.blockrow:contains("invalid")
  test:
    path: torrentslist.php
    selector: ul.isuser

search:
  paths:
    - path: GT_torrents/GT_ajax_search.php
      response:
        type: xml
      inputs:
        page: 0
    - path: GT_torrents/GT_ajax_search.php
      response:
        type: xml
      inputs:
        page: 1
    - path: GT_torrents/GT_ajax_search.php
      response:
        type: xml
      inputs:
        page: 2
    - path: GT_torrents/GT_ajax_search.php
      response:
        type: xml
      inputs:
        page: 3
    - path: GT_torrents/GT_ajax_search.php
      response:
        type: xml
      inputs:
        page: 4
  inputs:
    # category search is not supported, only tag search which is AND not OR
    filename: "{{ .Keywords }}"
    description: "{{ if .Query.IMDBID }}{{ .Query.IMDBID }}{{ else }}{{ end }}"
    where: "{{ if .Config.freeleech }}freeleech{{ else }}{{ end }}"
  keywordsfilters:
    - name: re_replace
      args: ["(\\d{2}\\.\\d{2}\\.\\d{2})", "{{ if .Config.whisparrv2 }}{{ else }}$1{{ end }}"] # strip release date from query for whisparr v2 compatibility
    - name: re_replace
      args: ["(\\w{4,})", "+$1"] # prepend + to each word with 4+ characters
    - name: re_replace
      args: ["\\+with\\b\\s?", " "] # 'with' is treated as a stop word and breaks the search when AND searched

  rows:
    selector: torrent

  fields:
    category:
      selector: torrentdata
      filters:
        - name: regexp
          args: "torrentslist\\.php\\?type=(.+?)\""
    title:
      selector: torrentdata
      filters:
        - name: regexp
          args: "torrentdetails\\.php\\?torrentid=.+?>(.+?)<\\/a>"
    details:
      selector: torrentdata
      filters:
        - name: regexp
          args: "(torrentdetails\\.php\\?torrentid=.+?)\""
        - name: prepend
          args: "/"
    download:
      text: "{{ .Result.details }}"
      filters:
        - name: append
          args: "&do=download"
    size:
      selector: torrentdata
      filters:
        - name: regexp
          args: "Torrent-List-Size\">(.+?)<\\/li>"
    seeders:
      selector: torrentdata
      filters:
        - name: regexp
          args: "orrent-List-Seeds\">(.+?)<\\/li>"
    leechers:
      selector: torrentdata
      filters:
        - name: regexp
          args: "Torrent-List-Peers\">(.+?)<\\/li>"
    date:
      selector: torrentdata
      filters:
        - name: regexp
          args: "Torrent-List-Date\">(.+?)<\\/li>"
        - name: append
          args: " +02:00" # EET
        - name: dateparse
          args: "HH:mm dd-MMM-yyyy zzz"
    downloadvolumefactor:
      case:
        "torrentdata:contains(\"[FFL]\")": 0
        "*": 1
    uploadvolumefactor:
      text: 1
# Morbid Suite vB4 XML
