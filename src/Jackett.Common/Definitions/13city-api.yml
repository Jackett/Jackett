---
id: 13city-api
name: 13City (API)
description: "13City is a CHINESE Private Torrent Tracker for MOVIES / TV / GENERAL"
language: zh-CN
type: private
encoding: UTF-8
links:
  - https://13city.org/

caps:
  categorymappings:
    - {id: 401, cat: Movies, desc: "电影/Movies"}
    - {id: 402, cat: TV, desc: "电视剧/TVSeries"}
    - {id: 403, cat: TV, desc: "综艺/TV Shows"}
    - {id: 405, cat: TV/Anime, desc: "动漫/Animations"}
    - {id: 406, cat: Audio/Video, desc: "演唱会、MV/Music Videos"}
    - {id: 408, cat: Audio, desc: "音乐/Music"}
    - {id: 409, cat: Books/EBook, desc: "电子书/E-book"}
    - {id: 409, cat: Audio/Audiobook, desc: "有声读物/A-book"}
    - {id: 413, cat: TV/Documentary, desc: "纪录片/Documentary"}

  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]
    book-search: [q]

settings:
  - name: apikey
    type: text
    label: API Token
  - name: info_apikey
    type: info
    label: About your API Token
    default: "Find/Generate an API token from your <a href=\"https://13city.org/usercp.php\" target=\"_blank\">13City</a> account control panel."
  - name: passkey
    type: text
    label: Passkey
  - name: info_passkey
    type: info
    label: About your Passkey
    default: "Find the Passkey from your account control panel."
  - name: freeleech
    type: checkbox
    label: Filter freeleech only
    default: false
  - name: sort
    type: select
    label: Sort requested from site
    default: "-id"
    options:
      "-id": created
      "-seeders": seeders
      "-size": size
      "-times_completed": grabs
  - name: info_activity
    type: info
    label: Account Inactivity
    default: "Account retention rules:<ol><li>If there is no valid traffic within 7 days of registration (participation in the calculation of sharing rate), the account will be blocked</li><li>After the level is reduced to \"Peasant\", if the sharing rate is not improved within 7 days, the account will be blocked</li><li>Long-term non-login:<ul>- UnParked account: 60 consecutive days of non-login → banned</ul><ul>- Parked account: 180 consecutive days of non-login → banned</ul><ul>- Nexus Master and above levels are not subject to long-term non-login ban restrictions</ul></li></ol>"

login:
  path: api/v1/torrents
  method: get
  inputs:
    per_page: 1
  error:
    - selector: :root:contains("login.php?returnto")
      message:
        text: "The API token was not accepted by {{ .Config.sitelink }}."
    - selector: :root:contains("Unauthenticated")
      message:
        text: "The API token was not accepted by {{ .Config.sitelink }}."

search:
  paths:
    - path: api/v1/torrents
      response:
        type: json

  headers:
    Authorization: ["Bearer {{ .Config.apikey }}"]

  inputs:
    $raw: "{{ range .Categories }}&filter[category][in][]={{.}}{{end}}"
    "filter[title]": "{{ .Keywords }}"
    sorts: "{{ .Config.sort }}"
    per_page: 100

  keywordsfilters:
    # the site stores dotted release names but the title filter matches on words
    - name: re_replace
      args: ["\\.", " "]

  rows:
    selector: "data.data{{ if .Config.freeleech }}:not(promotion_info.down_multiplier:contains(1)):not(promotion_info.down_multiplier:contains(.)){{ else }}{{ end }}"

  fields:
    category:
      selector: category
    _id:
      selector: id
    title:
      selector: name
    details:
      text: "{{ .Config.sitelink }}details.php?id={{ .Result._id }}&hit=1"
    download:
      text: "{{ .Config.sitelink }}download.php?id={{ .Result._id }}&passkey={{ .Config.passkey }}"
    infohash:
      selector: hash
    poster:
      selector: cover
    description:
      selector: small_descr
    size:
      selector: size
    files:
      selector: numfiles
    seeders:
      selector: seeders
    leechers:
      selector: leechers
    grabs:
      selector: times_completed
    date:
      # 2026-09-19 16:50
      selector: added
      filters:
        - name: append
          args: " +08:00" # CST
        - name: dateparse
          args: "yyyy-MM-dd HH:mm zzz"
    downloadvolumefactor:
      # promotion_info is the EFFECTIVE promotion and accounts for site-wide freeleech events.
      # sp_state is only the stored per-torrent promotion, so it reads 1 on a torrent the site has made free.
      selector: promotion_info.down_multiplier
    uploadvolumefactor:
      selector: promotion_info.up_multiplier
    minimumratio:
      text: 2.0
    minimumseedtime:
      # 1 day (as seconds = 24 x 60 x 60)
      text: 86400
    description:
      selector: td.rowfollow:nth-child(2)
      remove: a, b, font, img, span
# JSON API NexusPHP v1.9.11 2025-11-02
