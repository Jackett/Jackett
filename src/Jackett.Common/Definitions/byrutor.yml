---
id: byrutor
name: Byrutor
description: "Byrutor is a RUSSIAN Public Torrent Tracker for GAMES"
language: ru-RU
type: public
encoding: UTF-8
links:
  - https://byrutgame.org/
legacylinks:
  - https://byrutor.org/
  - https://byrutdb.org/
  - https://byrut.org/
  - https://thebyrut.org/
  - https://byruthub.org/

caps:
  categorymappings:
    - {id: games, cat: PC/Games, desc: "Games"}

  modes:
    search: [q]

settings: []

download:
  selectors:
    - selector: a.itemdown_games
      attribute: href

search:
  # https://byrutgame.org/engine/ajax/controller.php?mod=game_search&action=suggest&q=game
  paths:
    - path: engine/ajax/controller.php
      response:
        type: json

  inputs:
    mod: game_search
    action: suggest
    q: "{{ if .Keywords }}{{ .Keywords }}{{ else }}game{{ end }}"

  rows:
    selector: items

  fields:
    category:
      text: games
    year:
      selector: year
    title:
      selector: title
      filters:
        - name: append
          args: " [{{ .Result.year }}]"
    details:
      selector: url
    download:
      selector: url
    poster:
      selector: poster
    size:
      text: 25GB
    date:
      text: now
    seeders:
      text: 1
    leechers:
      text: 1
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
# json
