---
id: bitagent
name: BitAgent
description: "BitAgent is a Private Torrent Tracker for MOVIES / TV"
language: en-US
type: private
encoding: UTF-8
links:
  - https://bit-agent.org/

caps:
  categorymappings:
    # from https://bit-agent.org/torznab/api?t=caps&apikey=YOUR-API-KEY
    - {id: 2000, cat: Movies, desc: "Movies"}
    - {id: 2030, cat: Movies/SD, desc: "Movies/SD"}
    - {id: 2040, cat: Movies/HD, desc: "Movies/HD"}
    - {id: 2045, cat: Movies/UHD, desc: "Movies/UHD"}
    - {id: 2060, cat: Movies/3D, desc: "Movies/3D"}
    - {id: 3000, cat: Audio, desc: "Audio"}
    - {id: 3030, cat: Audio/Audiobook, desc: "Audio/Audiobook"}
    - {id: 4000, cat: PC, desc: "PC"}
    - {id: 4050, cat: PC/Games, desc: "PC/Games"}
    - {id: 5000, cat: TV, desc: "TV"}
    - {id: 5030, cat: TV/SD, desc: "TV/SD"}
    - {id: 5040, cat: TV/HD, desc: "TV/HD"}
    - {id: 5045, cat: TV/UHD, desc: "TV/UHD"}
    - {id: 5070, cat: TV/Anime, desc: "TV/Anime"}
    - {id: 6000, cat: XXX, desc: "XXX"}
    - {id: 6070, cat: XXX/Other, desc: "XXX/Other"}
    - {id: 7000, cat: Books, desc: "Books"}
    - {id: 7020, cat: Books/EBook, desc: "Books/EBook"}
    - {id: 7030, cat: Books/Comics, desc: "Books/Comics"}
    - {id: 8000, cat: Other, desc: "Other"}

  modes:
    search: [q]
    tv-search: [q, season, ep, imdbid, tmdbid]
    movie-search: [q, imdbid, tmdbid]
    book-search: [q]
    music-search: [q]
  allowtvsearchimdb: true

settings:
  - name: apikey
    type: text
    label: API Key
  - name: info_key
    type: info
    label: About your API Key
    default: "You can find your API Key by accessing the <a href=\"https://bit-agent.org/\" target=\"_blank\">BitAgent  Settings</a> page and scrolling down to the <b>API Key</b> section."

login:
  # returns "401 Unauthorized, check your credentials" if apikey is invalid
  path: torznab/api
  method: get
  inputs:
    apikey: "{{ .Config.apikey }}"
    t: caps

search:
  paths:
    - path: torznab/api
      response:
        type: xml

  inputs:
    apikey: "{{ .Config.apikey }}"
    t: "{{ if .Query.Type }}{{ .Query.Type }}{{ else }}search{{ end }}"
    q: "{{ .Keywords }}"
    cat: "{{ join .Categories \",\" }}"
    season: "{{ .Query.Season }}"
    ep: "{{ .Query.Ep }}"
    imdbid: "{{ .Query.IMDBID }}"
    tmdbid: "{{ .Query.TMDBID }}"
    limit: 100

  rows:
    selector: rss > channel > item
    filters:
      - name: andmatch

  fields:
    category:
      selector: "[name=category]"
      attribute: value
    title:
      selector: title
    details:
      text: "{{ .Config.sitelink }}"
    download:
      selector: enclosure
      attribute: url
    infohash:
      selector: "[name=infohash]"
      attribute: value
    date:
      # Fri, 02 Oct 2026 16:06:55 -0600
      selector: pubDate
      filters:
        - name: dateparse
          args: "ddd, dd MMM yyyy HH:mm:ss zzz"
    size:
      selector: "[name=size]"
      attribute: value
    imdbid:
      selector: "[name=imdb]"
      attribute: value
    tmdbid:
      selector: "[name=tmdb]"
      attribute: value
    seeders:
      selector: "[name=seeders]"
      attribute: value
      optional: true
      default: 1
    leechers:
      selector: "[name=leechers]"
      attribute: value
      optional: true
      default: 1
    downloadvolumefactor:
      text: 1
    uploadvolumefactor:
      text: 1
#    minimumratio:
#      text: 2.0
#    minimumseedtime:
      # 3 days (as seconds = 3 x 24 x 60 x 60)
#      text: 259200
# torznab xml
