---
id: pornotorrent
name: PornoTorrent
description: "PornoTorrent is a BRAZILIAN Public Torrent Tracker for 3X"
language: pt-BR
type: public
encoding: UTF-8
testlinktorrent: false
links:
  - https://pornotorrent.com.br/
legacylinks:
  - https://pornotorrent.net.br/

caps:
  categorymappings:
    - {id: 6000, cat: XXX, desc: "XXX"}
    - {id: 6010, cat: XXX/DVD, desc: "XXX/DVD"}
    - {id: 6070, cat: XXX/SD, desc: "XXX/SD"}
    - {id: 6080, cat: XXX/WEB-DL, desc: "XXX/WEB-DL"}

  modes:
    search: [q]
    movie-search: [q]

settings: []

search:
  paths:
    - path: torznab/
      method: get
      response:
        type: xml

  inputs:
    t: search
    q: "{{ .Keywords }}"
    limit: 100

  rows:
    selector: channel > item

  fields:
    category:
      selector: "[name=category]"
      attribute: value
    title:
      selector: title
    details:
      selector: guid
    magnet:
      selector: enclosure
      attribute: url
    size:
      selector: size
    date:
      # Sat, 01 Aug 2026 01:00:00 GMT
      selector: pubDate
      filters:
        - name: dateparse
          args: "ddd, dd MMM yyyy HH:mm:ss zzz"
    seeders:
      text: 1
    leechers:
      text: 0
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
# torznab xml
