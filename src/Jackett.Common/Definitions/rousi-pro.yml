---
id: rousi-pro
name: Rousi.pro
description: "Rousi.pro is a CHINESE Private Torrent Tracker for MOVIES / TV / GENERAL"
language: zh-CN
type: private
encoding: UTF-8
links:
  - https://rousi.pro/

caps:
  categorymappings:
    - {id: movies, cat: Movies, desc: "电影"}
    - {id: tv, cat: TV, desc: "电视剧"}
    - {id: documentary, cat: TV/Documentary, desc: "纪录片"}
    - {id: anime, cat: TV/Anime, desc: "动漫"}
    - {id: music, cat: Audio, desc: "音乐"}
    - {id: variety, cat: TV, desc: "综艺"}
    - {id: sports, cat: TV/Sport, desc: "体育"}
    - {id: software, cat: PC, desc: "软件"}
    - {id: ebooks, cat: Books, desc: "电子书"}
    - {id: 9kg, cat: XXX, desc: "9KG"}
    - {id: other, cat: Other, desc: "其它"}

  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]
    book-search: [q]

settings:
  - name: cookie
    type: text
    label: Cookie
  - name: info_cookie
    type: info_cookie
  - name: freeleech
    type: checkbox
    label: Search freeleech only
    default: false
  - name: sort
    type: select
    label: Sort requested from site
    default: published
    options:
      published: created
      size: size
  - name: type
    type: select
    label: Order requested from site
    default: DESC
    options:
      desc: desc
      asc: asc
  - name: info_activity
    type: info
    label: Account Inactivity
    default: "Account retention rules (Inactive Accounts):<ol><li>Not logged in for more than 30 days: Send email reminders</li><li>Not logged in for more than 60 days: 5000 Mana points are deducted daily</li><li>After the mana value is deducted to 0: the account is banned</li><li>If the user expects to be unable to log in for a period of time, they can pay in advance 150,000 mana to protect account for 60 days</li></ol>"

login:
  method: cookie
  inputs:
    cookie: "{{ .Config.cookie }}"
#  test:
#    path: /
#    selector: a[href="/account"]

search:
  paths:
    - path: api/v1/torrents
      response:
        type: json

  inputs:
    query: "{{ .Keywords }}"
    promotion: "{{ if .Config.freeleech }}free{{ else }}{{ end }}"
    sort: "{{ .Config.sort }}_{{ .Config.type }}"
    limit: 50

  keywordsfilters:
    - name: re_replace
      args: ["[\\.\\s]", " "]

  rows:
    selector: items

  fields:
    _id:
      selector: id
    title:
      selector: name
    category:
      selector: category.id
    details:
      text: "{{ .Config.sitelink }}torrents/{{ .Result._id }}"
    download:
      text: "{{ .Config.sitelink }}api/v1/torrents/{{ .Result._id }}/download"
    poster:
      text: "{{ .Config.sitelink }}api/v1/torrents/{{ .Result._id }}/cover"
    description:
      selector: subtitle
    seeders:
      selector: seeders
    leechers:
      selector: leechers
    grabs:
      selector: completed
    date:
      # "uploaded_at": "2021-10-18T00:34:50.000000Z" is returned by Newtonsoft.Json.Linq as 18/10/2021 00:34:50
      selector: uploaded_at
      filters:
        - name: append
          args: " +00:00" # GMT
        - name: dateparse
          args: "MM/dd/yyyy HH:mm:ss zzz"
    size:
      selector: size_bytes
    downloadvolumefactor:
      selector: promotion
      case:
        free: 0
        double_upload: 1
        double_upload_free: 0
        half_download: 0.5
        double_upload_half_download: 0.5
        thirty_percent_download: 0.3
        "*": 1
    uploadvolumefactor:
      selector: promotion
      case:
        free: 1
        double_upload: 2
        double_upload_free: 2
        half_download: 1
        double_upload_half_download: 2
        thirty_percent_download: 1
        "*": 1
    minimumratio:
      text: 1.0
    minimumseedtime:
      # 1 day (as seconds = 24 x 60 x 60)
      text: 86400
# json api
