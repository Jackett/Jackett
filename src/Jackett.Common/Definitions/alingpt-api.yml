---
id: alingpt-api
name: alingPT (API)
description: "alingPT is a CHINESE Private Torrent Tracker for MOVIES / TV"
language: zh-CN
type: private
encoding: UTF-8
links:
  - https://pt.aling.de/

caps:
  categorymappings:
    - {id: 405, cat: TV/Anime, desc: "Animations/动画"}
    - {id: 402, cat: TV, desc: "TV Series/电视剧"}
    - {id: 401, cat: Movies, desc: "Movies/电影"}
    - {id: 404, cat: TV/Documentary, desc: "Documentary/纪录片"}

  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]

settings:
  - name: apikey
    type: text
    label: API Token
  - name: info_apikey
    type: info
    label: About your API Token
    default: "Find/Generate an API token from your <a href=\"https://pt.aling.de/usercp.php\" target=\"_blank\">alingPT</a> account control panel."
  - name: passkey
    type: text
    label: Passkey
  - name: info_passkey
    type: info
    label: About your Passkey
    default: "Find the Passkey from your account control panel."
  - name: freeleech
    type: checkbox
    label: Filter freeleech only
    default: false
  - name: sort
    type: select
    label: Sort requested from site
    default: "-id"
    options:
      "-id": created
      "-seeders": seeders
      "-size": size
      "-times_completed": grabs
  - name: info_activity
    type: info
    label: Account Inactivity
    default: "Account retention rules:<ol><li>Veteran User and above will be retained forever</li><li>Accounts parked will not be deleted</li><li>Users with a parked account will be deleted if they do not log in for 400 consecutive days</li><li>Users with a non-parked account will be deleted if they do not log in for 200 consecutive days</li><li>Users who have no traffic (i.e. upload/download data are both 0) will be deleted if they do not log in for 60 consecutive days.</li></ol>"

login:
  path: api/v1/torrents
  method: get
  inputs:
    per_page: 1
  error:
    - selector: :root:contains("login.php?returnto")
      message:
        text: "The API token was not accepted by {{ .Config.sitelink }}."
    - selector: :root:contains("Unauthenticated")
      message:
        text: "The API token was not accepted by {{ .Config.sitelink }}."

search:
  paths:
    - path: api/v1/torrents
      response:
        type: json

  headers:
    Authorization: ["Bearer {{ .Config.apikey }}"]

  inputs:
    $raw: "{{ range .Categories }}&filter[category][in][]={{.}}{{end}}"
    "filter[title]": "{{ .Keywords }}"
    sorts: "{{ .Config.sort }}"
    per_page: 100

  keywordsfilters:
    # the site stores dotted release names but the title filter matches on words
    - name: re_replace
      args: ["\\.", " "]

  rows:
    selector: "data.data{{ if .Config.freeleech }}:not(promotion_info.down_multiplier:contains(1)):not(promotion_info.down_multiplier:contains(.)){{ else }}{{ end }}"

  fields:
    category:
      selector: category
    _id:
      selector: id
    title:
      selector: name
    details:
      text: "{{ .Config.sitelink }}details.php?id={{ .Result._id }}&hit=1"
    download:
      text: "{{ .Config.sitelink }}download.php?id={{ .Result._id }}&passkey={{ .Config.passkey }}"
    infohash:
      selector: hash
    poster:
      selector: cover
    description:
      selector: small_descr
    size:
      selector: size
    files:
      selector: numfiles
    seeders:
      selector: seeders
    leechers:
      selector: leechers
    grabs:
      selector: times_completed
    date:
      # 2026-09-19 16:50
      selector: added
      filters:
        - name: append
          args: " +08:00" # CST
        - name: dateparse
          args: "yyyy-MM-dd HH:mm zzz"
    downloadvolumefactor:
      # promotion_info is the EFFECTIVE promotion and accounts for site-wide freeleech events.
      # sp_state is only the stored per-torrent promotion, so it reads 1 on a torrent the site has made free.
      selector: promotion_info.down_multiplier
    uploadvolumefactor:
      selector: promotion_info.up_multiplier
    minimumratio:
      text: 2.0
    minimumseedtime:
      # 2 days (as seconds = 2 x 24 x 60 x 60)
      text: 172800
# JSON API NexusPHP v1.10.1 2026-02-17
