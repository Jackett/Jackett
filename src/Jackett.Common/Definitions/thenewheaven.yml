  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]
    book-search: [q]

settings:
  - name: username
    type: text
    label: Username
  - name: password
    type: password
    label: Password
  - name: onlyupload
    type: checkbox
    label: Search OnlyUpload only
    default: false
  - name: info_free
    type: info
    label: About OnlyUpload at The New Heaven
    default: "<ul><li>OnlyUpload are torrents where download is not counted but upload is. Good for building your Ratio up. (On the Jackett dashboard search results these are tagged as Freeleech).</li></ul>"
  - name: sort
    type: select
    label: Sort requested from site
    default: added
    options:
      added: created
      seeds: seeders
      size: size
      name: title
  - name: type
    type: select
    label: Order requested from site
    default: desc
    options:
      desc: desc
      asc: asc
  - name: info_tpp
    type: info
    label: Results Per Page
    default: For best results, change the <b>Torrents pro Seite:</b> setting to <b>100</b> on your <b>Profil bearbeiten</b> page. The default is <i>15</i>.
  - name: info_activity
    type: info
    label: Account Inactivity
    default: "Inactive accounts are automatically deleted after 42 days."
  - name: info_seedhours
    type: info
    label: Seeding Hours
    default: Before using this indexer, make sure that you have set <b>Meine Seedzeit</b> on your <b>Profil bearbeiten</b> page.

login:
  path: login.php
  method: form
  cookies: ["JAVA=OK"] # avoid jscheck redirect
  inputs:
    username: "{{ .Config.username }}"
    password: "{{ .Config.password }}"
  error:
    - selector: div#login-wrap:contains("Anmeldung Gescheitert!") > div.countdown_wrap
  test:
    path: index.php
    selector: a[href="logout.php"]

search:
  paths:
    - path: browse.php
  inputs:
    $raw: "{{ range .Categories }}c{{.}}=1&{{end}}"
    search: "{{ .Keywords }}"
    showsearch: 1
    # 0 Name, 1 Description, 2 Both
    blah: 0
    # 0 active, 1 all, 2 dead, onlyup, freeleech, halfleech, multi, highlight, recommended, neu
    incldead: "{{ if .Config.onlyupload }}onlyup{{ else }}1{{ end }}"
    orderby: "{{ .Config.sort }}"
    sort: "{{ .Config.type }}"
    # site does not support imdbid searching or display imdb links in results.

  rows:
    selector: tr[id^="tselrow"]
    filters:
      - name: andmatch

  fields:
    category:
      selector: a[href*="browse.php?cat="]
      attribute: href
      filters:
        - name: querystring
          args: cat
    title:
      selector: a[href*="details.php?id="]:has(b)
    details:
      selector: a[href*="details.php?id="]:has(b)
      attribute: href
    download:
      selector: a[href*="download.php?torrent="]
      attribute: href
    size:
      selector: td:nth-last-child(3)
    grabs:
      selector: td:nth-last-child(5)
    files:
      selector: td:nth-last-child(4)
    seeders:
      selector: td:nth-last-child(8)
    leechers:
      selector: td:nth-last-child(7)
    date_day:
      # Heute 13:30:04
      # Gestern 09:10:10
      selector: td:nth-last-child(3):contains("Heute"), td:nth-last-child(3):contains("Gestern")
      optional: true
      filters:
        - name: replace
          args: ["Heute", "Today"]
        - name: replace
          args: ["Gestern", "Yesterday"]
        - name: append
          args: "+01:00" # CET
    date_year:
      # 30.02.2018<br>23:12:50
      selector: td:nth-last-child(3):contains("."):contains(":")
      optional: true
      filters:
        - name: append
          args: "+01:00" # CET
        - name: dateparse
          args: "dd.MM.yyyy HH:mm:ss zzz"
    date:
      text: "{{ if or .Result.date_year .Result.date_day }}{{ or .Result.date_year .Result.date_day }}{{ else }}now{{ end }}"
    downloadvolumefactor:
      case:
        span[style*="ffa500"]:contains("OU"): 0 # only upload is counted
        "*": 1
    uploadvolumefactor:
      case:
        span[style*="ff33aa"]:contains("FL"): 0 # nothing is counted
        span[style*="orange"]:contains("2x"): 2
        span[style*="orange"]:contains("5x"): 5
        span[style*="orange"]:contains("10x"): 10
        "*": 1
    minimumratio:
      text: 0.7
    minimumseedtime:
      # 2 days (as seconds = 2 x 24 x 60 x 60)
      text: 172800
# NetVision
