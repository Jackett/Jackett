---
id: trackerformers
name: Trackerformers
description: "Trackerformers is a GERMAN Private Torrent Tracker for MOVIES / TV / GENERAL"
language: de-DE
type: private
encoding: UTF-8
links:
  - https://trackerformers.org/

caps:
  categorymappings:
    - {id: 166, cat: Movies, desc: "Allgemein Movies"}
    - {id: 166, cat: TV, desc: "Allgemein TV"}
    - {id: 157, cat: TV/Documentary, desc: "Doku 1080p"}
    - {id: 156, cat: TV/Documentary, desc: "Doku 720p"}
    - {id: 155, cat: TV/Documentary, desc: "Doku SD x264/x265"}
    - {id: 152, cat: Books/EBook, desc: "E-Books"}
    - {id: 165, cat: Movies/3D, desc: "Filme 3D"}
    - {id: 141, cat: Movies/HD, desc: "Filme HD 1080p"}
    - {id: 154, cat: Movies/HD, desc: "Filme HD 720p"}
    - {id: 139, cat: Movies/HD, desc: "Filme Packs HD 1080p"}
    - {id: 106, cat: Movies/HD, desc: "Filme Packs HD 720p"}
    - {id: 105, cat: Movies/SD, desc: "Filme Packs SD x264/x265"}
    - {id: 153, cat: Movies/SD, desc: "Filme SD x264/x265"}
    - {id: 140, cat: Movies/UHD, desc: "Filme UHD 2160p"}
    - {id: 118, cat: Audio/Audiobook, desc: "Hörbücher"}
    - {id: 129, cat: Audio, desc: "Musik MP3/FLAC"}
    - {id: 112, cat: Audio, desc: "Musik Packs MP3/FLAC"}
    - {id: 167, cat: TV/UHD, desc: "Serie 2160"}
    - {id: 113, cat: TV/HD, desc: "Serie HD 1080p"}
    - {id: 125, cat: TV/HD, desc: "Serie HD 720p"}
    - {id: 138, cat: TV/HD, desc: "Serie Packs HD 1080p"}
    - {id: 116, cat: TV/HD, desc: "Serie Packs HD 720p"}
    - {id: 137, cat: TV/SD, desc: "Serie Packs SD x264/x265"}
    - {id: 133, cat: TV/SD, desc: "Serie SD x264/x265"}
    - {id: 168, cat: TV/UHD, desc: "Serien Packs 2160"}
    - {id: 161, cat: Other, desc: "Sonstige"}
    - {id: 163, cat: TV/Sport, desc: "Sport"}
    - {id: 150, cat: PC/0day, desc: "Windows Apps"}
    - {id: 149, cat: PC/Games, desc: "Windows Spiele"}
    - {id: 147, cat: XXX/x264, desc: "XXX HD 1080p"}
    - {id: 146, cat: XXX/x264, desc: "XXX HD 720p"}
    - {id: 148, cat: XXX/Pack, desc: "XXX Packs"}
    - {id: 69, cat: XXX/SD, desc: "XXX SD x264/x265"}
    - {id: 151, cat: Books/Mags, desc: "Zeitschriften"}

  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]
    book-search: [q]
  allowrawsearch: true

settings:
  - name: username
    type: text
    label: Username
  - name: password
    type: password
    label: Password
  - name: pin
    type: password
    label: PIN
  - name: freeleech
    type: checkbox
    label: Filter FreeLeech
    default: false
  - name: onlyupload
    type: checkbox
    label: Filter OnlyUpload
    default: false
  - name: info_free
    type: info
    label: About Freeleech and OnlyUpload at Trackerformers
    default: "<ul><li>FreeLeech are torrents where neither the download or upload is counted.</li><li>OnlyUpload are torrents where download is not counted but upload is. Good for building your Ratio up.</li></ul>"
  - name: sort
    type: select
    label: Sort requested from site
    default: added
    options:
      added: created
      seeds: seeders
      size: size
      name: title
  - name: type
    type: select
    label: Order requested from site
    default: desc
    options:
      desc: desc
      asc: asc

login:
  path: login.php
  method: form
  form: form[action="../takelogin.php"]
  cookies: ["JAVA=OK"]
  inputs:
    username: "{{ .Config.username }}"
    password: "{{ .Config.password }}"
    secure_pin: "{{ .Config.pin }}"
  error:
    - selector: table:contains("Anmeldung Gescheitert!")
  test:
    path: index.php
    selector: a[href="logout.php"]

search:
  paths:
    # https://trackerformers.org/browse.php?showsearch=1&search=&incldead=1&orderby=added&sort=desc
    - path: browse.php
  inputs:
    $raw: "{{ range .Categories }}c{{.}}=1&{{end}}"
    showsearch: 1
    search: "{{ .Keywords }}"
    # 0 active, 1 all, 2 dead
    incldead: 1
    orderby: "{{ .Config.sort }}"
    sort: "{{ .Config.type }}"

  rows:
    selector: "table.tableinborder:nth-of-type(2) > tbody > tr:has(a[href^=\"download.php?torrent=\"]){{ if .Config.onlyupload }}:has(img[src=\"pic/oupic.gif\"]){{ else }}{{ end }}{{ if .Config.freeleech }}:has(img[src=\"pic/freeleech.gif\"]){{ else }}{{ end }}"

  fields:
    category:
      selector: a[href^="browse.php?cat="]
      attribute: href
      filters:
        - name: querystring
          args: cat
    title:
      selector: a[href^="details.php?id="]
    details:
      selector: a[href^="details.php?id="]
      attribute: href
    download:
      selector: a[href^="download.php?torrent="]
      attribute: href
    size:
      selector: table tr:nth-child(2) > td:nth-child(1) > b:nth-child(1)
    files:
      selector: table tr:nth-child(2) > td:nth-child(1) > b:nth-child(2)
      optional: true
      default: 1
    seeders:
      selector: table tr:nth-child(2) > td:nth-child(2) > b:nth-child(1)
      optional: true
      default: 0
    leechers:
      selector: table tr:nth-child(2) > td:nth-child(2) > b:nth-child(2)
      optional: true
      default: 0
    grabs:
      selector: table tr:nth-child(2) > td:nth-child(3) > b
      optional: true
      default: 0
    date:
      selector: table tr:nth-child(2) > td:nth-child(5)
      filters:
        - name: replace
          args: ["\u00a0", " "]
        - name: append
          args: " +01:00" # CET
        - name: dateparse
          args: "dd.MM.yyyy HH:mm:ss zzz"
    downloadvolumefactor:
      case:
        img[src="pic/oupic.gif"]: 0
        img[src="pic/freeleech.gif"]: 0
        "*": 1
    uploadvolumefactor:
      case:
        img[src="pic/freeleech.gif"]: 0
        "*": 1
    minimumratio:
      text: 0.8
    minimumseedtime:
      text: 216000
# engine n/a
